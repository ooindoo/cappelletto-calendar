<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ── CONFIG ─────────────────────────────────────────── */
const SUPABASE_URL = "https://amcrfoghuurbnpmstzyk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtY3Jmb2dodXVyYm5wbXN0enlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMzk3ODgsImV4cCI6MjEwMDcxNTc4OH0.BHgy5znAHlRIT__I1u2pOIkjZF-GlY0QGOJf7msOs3c";

const STORAGE_BUCKET = "campaign-images";

const MONTHS = [
  { n: 8, name: "Agosto" },
  { n: 9, name: "Settembre" },
  { n: 10, name: "Ottobre" },
  { n: 11, name: "Novembre" },
  { n: 12, name: "Dicembre" },
];

const TYPES = {
  launch:     { label: "Lancio Prodotto" },
  promo:      { label: "Promozione / Sconto" },
  newsletter: { label: "Newsletter" },
  editorial:  { label: "Editoriale / Storytelling" },
  event:      { label: "Evento / Fiera" },
  automation: { label: "Automazione / Flow" },
};

const STATUSES = {
  confirmed: { label: "Confermato",   color: "#2E7D32" },
  planned:   { label: "Pianificato",  color: "#1565C0" },
  tbd:       { label: "TBD",          color: "#E65100" },
};

const emptyForm = () => ({
  label: "", type: "newsletter", status: "tbd",
  month: 8, day: 1, end_day: "", notes: "",
});

/* ── HELPERS ────────────────────────────────────────── */
function typeOf(c) { return TYPES[c.type] || TYPES.newsletter; }
function statusOf(c) { return STATUSES[c.status] || STATUSES.tbd; }

// Color is reserved exclusively for status. "planned" renders as a
// dashed outline instead of a solid fill so it reads at a glance
// without relying on color alone.
function statusDotStyle(status) {
  const cfg = STATUSES[status] || STATUSES.tbd;
  return status === "planned"
    ? { background: "#fff", borderColor: cfg.color }
    : { background: cfg.color, borderColor: cfg.color };
}
function statusBorderLeft(status) {
  const cfg = STATUSES[status] || STATUSES.tbd;
  return { borderLeftColor: cfg.color, borderLeftStyle: status === "planned" ? "dashed" : "solid" };
}
function statusBorderTop(status) {
  const cfg = STATUSES[status] || STATUSES.tbd;
  return { borderTopColor: cfg.color, borderTopStyle: status === "planned" ? "dashed" : "solid" };
}

// Resizes/compresses an image client-side before upload so storage
// isn't wasted on full-resolution phone photos.
function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 1600;
  quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(objectUrl);
        blob ? resolve(blob) : reject(new Error("Compressione immagine fallita"));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("File immagine non valido")); };
    img.src = objectUrl;
  });
}

// Forces a real "Save As" download (vs. navigating) regardless of
// how the storage CDN sets Content-Disposition.
async function downloadFile(url, filename) {
  const res = await fetch(url);
  const blob = await res.blob();
  const objectUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = objectUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(objectUrl);
}

/* ── APP ────────────────────────────────────────────── */
function App() {
  const [campaigns, setCampaigns] = useState([]);
  const [images, setImages] = useState([]);
  const [links, setLinks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [sync, setSync] = useState({ state: "hidden", message: "" });
  const [view, setView] = useState("timeline");
  const [search, setSearch] = useState("");
  const [activeTypes, setActiveTypes] = useState(new Set(Object.keys(TYPES)));
  const [activeStatus, setActiveStatus] = useState("all");
  const [selectedId, setSelectedId] = useState(null);
  const [modal, setModal] = useState(null);       // null | { mode:'create' } | { mode:'edit', campaign }
  const [deleteTarget, setDeleteTarget] = useState(null);

  const showSync = (state, message) => setSync({ state, message });
  const flashSync = (state, message) => { showSync(state, message); setTimeout(() => showSync("hidden", ""), 1800); };

  const load = useCallback(async () => {
    const [campaignsRes, imagesRes, linksRes] = await Promise.all([
      sb.from("campaigns").select("*").order("month").order("day"),
      sb.from("campaign_images").select("*").order("sort_order"),
      sb.from("campaign_links").select("*").order("sort_order"),
    ]);
    setLoading(false);
    if (campaignsRes.error) { showSync("error", "Errore di connessione: " + campaignsRes.error.message); return; }
    setCampaigns(campaignsRes.data || []);
    setImages(imagesRes.data || []);
    setLinks(linksRes.data || []);
    if (imagesRes.error || linksRes.error) {
      showSync("error", "Immagini/link non disponibili: " + (imagesRes.error || linksRes.error).message);
      return;
    }
    showSync("connected", "Connesso — sincronizzazione in tempo reale");
    setTimeout(() => showSync("hidden", ""), 2200);
  }, []);

  useEffect(() => {
    load();
    const channel = sb.channel("db-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "campaigns" }, (payload) => {
        if (payload.eventType === "INSERT") {
          setCampaigns((prev) => prev.some((c) => c.id === payload.new.id) ? prev : [...prev, payload.new]);
        } else if (payload.eventType === "UPDATE") {
          setCampaigns((prev) => prev.map((c) => (c.id === payload.new.id ? payload.new : c)));
        } else if (payload.eventType === "DELETE") {
          setCampaigns((prev) => prev.filter((c) => c.id !== payload.old.id));
          setSelectedId((sel) => (sel === payload.old.id ? null : sel));
        }
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "campaign_images" }, (payload) => {
        if (payload.eventType === "INSERT") {
          setImages((prev) => prev.some((i) => i.id === payload.new.id) ? prev : [...prev, payload.new]);
        } else if (payload.eventType === "UPDATE") {
          setImages((prev) => prev.map((i) => (i.id === payload.new.id ? payload.new : i)));
        } else if (payload.eventType === "DELETE") {
          setImages((prev) => prev.filter((i) => i.id !== payload.old.id));
        }
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "campaign_links" }, (payload) => {
        if (payload.eventType === "INSERT") {
          setLinks((prev) => prev.some((l) => l.id === payload.new.id) ? prev : [...prev, payload.new]);
        } else if (payload.eventType === "UPDATE") {
          setLinks((prev) => prev.map((l) => (l.id === payload.new.id ? payload.new : l)));
        } else if (payload.eventType === "DELETE") {
          setLinks((prev) => prev.filter((l) => l.id !== payload.old.id));
        }
      })
      .subscribe();
    return () => sb.removeChannel(channel);
  }, [load]);

  async function createCampaign(data) {
    showSync("syncing", "Salvataggio...");
    const { data: row, error } = await sb.from("campaigns").insert([data]).select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return null; }
    setCampaigns((prev) => prev.some((c) => c.id === row.id) ? prev : [...prev, row]);
    flashSync("connected", "Campagna salvata");
    return row;
  }

  async function updateCampaign(id, data) {
    showSync("syncing", "Aggiornamento...");
    const { data: row, error } = await sb.from("campaigns").update(data).eq("id", id).select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return null; }
    setCampaigns((prev) => prev.map((c) => (c.id === id ? row : c)));
    flashSync("connected", "Campagna aggiornata");
    return row;
  }

  async function deleteCampaign(id) {
    showSync("syncing", "Eliminazione...");
    const orphanPaths = images.filter((i) => i.campaign_id === id).map((i) => i.storage_path);
    if (orphanPaths.length) await sb.storage.from(STORAGE_BUCKET).remove(orphanPaths);
    const { error } = await sb.from("campaigns").delete().eq("id", id);
    if (error) { flashSync("error", "Errore: " + error.message); return; }
    setCampaigns((prev) => prev.filter((c) => c.id !== id));
    setImages((prev) => prev.filter((i) => i.campaign_id !== id));
    setLinks((prev) => prev.filter((l) => l.campaign_id !== id));
    setSelectedId((sel) => (sel === id ? null : sel));
    flashSync("connected", "Campagna eliminata");
  }

  async function duplicateCampaign(c) {
    const { id, created_at, updated_at, ...rest } = c;
    const row = await createCampaign({ ...rest, label: c.label + " (copia)" });
    if (row) setSelectedId(row.id);
  }

  // items: [{ file, label }] — label falls back to "Immagine N" when blank.
  async function uploadImages(campaignId, items) {
    let order = images.filter((i) => i.campaign_id === campaignId).length;
    for (const item of items) {
      const file = item.file || item;
      const providedLabel = (item.label || "").trim();
      showSync("syncing", "Caricamento immagine...");
      try {
        const blob = await compressImage(file);
        const path = campaignId + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
        const { error: upErr } = await sb.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType: "image/jpeg" });
        if (upErr) throw upErr;
        const label = providedLabel || ("Immagine " + (order + 1));
        const { data: row, error: insErr } = await sb.from("campaign_images")
          .insert([{ campaign_id: campaignId, storage_path: path, label: label, sort_order: order }])
          .select().single();
        if (insErr) throw insErr;
        order++;
        setImages((prev) => prev.some((i) => i.id === row.id) ? prev : [...prev, row]);
      } catch (err) {
        flashSync("error", "Errore upload: " + err.message);
      }
    }
    flashSync("connected", "Immagini caricate");
  }

  async function updateImageLabel(imageId, label) {
    const { data: row, error } = await sb.from("campaign_images").update({ label }).eq("id", imageId).select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return; }
    setImages((prev) => prev.map((i) => (i.id === imageId ? row : i)));
  }

  async function deleteImage(image) {
    showSync("syncing", "Eliminazione immagine...");
    await sb.storage.from(STORAGE_BUCKET).remove([image.storage_path]);
    const { error } = await sb.from("campaign_images").delete().eq("id", image.id);
    if (error) { flashSync("error", "Errore: " + error.message); return; }
    setImages((prev) => prev.filter((i) => i.id !== image.id));
    flashSync("connected", "Immagine eliminata");
  }

  async function addLink(campaignId, label, url) {
    if (!url.trim()) return;
    showSync("syncing", "Salvataggio link...");
    const order = links.filter((l) => l.campaign_id === campaignId).length;
    const { data: row, error } = await sb.from("campaign_links")
      .insert([{ campaign_id: campaignId, label: label.trim(), url: url.trim(), sort_order: order }])
      .select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return; }
    setLinks((prev) => prev.some((l) => l.id === row.id) ? prev : [...prev, row]);
    flashSync("connected", "Link aggiunto");
  }

  async function deleteLink(id) {
    const { error } = await sb.from("campaign_links").delete().eq("id", id);
    if (error) { flashSync("error", "Errore: " + error.message); return; }
    setLinks((prev) => prev.filter((l) => l.id !== id));
  }

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return campaigns.filter((c) => {
      if (!activeTypes.has(c.type)) return false;
      if (activeStatus !== "all" && c.status !== activeStatus) return false;
      if (q && !(c.label || "").toLowerCase().includes(q) && !(c.notes || "").toLowerCase().includes(q)) return false;
      return true;
    });
  }, [campaigns, activeTypes, activeStatus, search]);

  const typeCounts = useMemo(() => {
    const counts = {};
    Object.keys(TYPES).forEach((t) => { counts[t] = campaigns.filter((c) => c.type === t).length; });
    return counts;
  }, [campaigns]);

  const stats = useMemo(() => ({
    total: campaigns.length,
    confirmed: campaigns.filter((c) => c.status === "confirmed").length,
    planned: campaigns.filter((c) => c.status === "planned").length,
    tbd: campaigns.filter((c) => c.status === "tbd").length,
  }), [campaigns]);

  const selected = campaigns.find((c) => c.id === selectedId) || null;

  const imagesByCampaign = useMemo(() => {
    const map = {};
    images.forEach((img) => { (map[img.campaign_id] = map[img.campaign_id] || []).push(img); });
    Object.values(map).forEach((arr) => arr.sort((a, b) => a.sort_order - b.sort_order || a.id - b.id));
    return map;
  }, [images]);

  const linksByCampaign = useMemo(() => {
    const map = {};
    links.forEach((l) => { (map[l.campaign_id] = map[l.campaign_id] || []).push(l); });
    Object.values(map).forEach((arr) => arr.sort((a, b) => a.sort_order - b.sort_order || a.id - b.id));
    return map;
  }, [links]);

  function imagePublicUrl(path) {
    return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
  }

  function getThumbUrl(campaignId) {
    const imgs = imagesByCampaign[campaignId];
    if (!imgs || !imgs.length) return null;
    const hero = imgs.find((i) => (i.label || "").trim().toLowerCase() === "hero") || imgs[0];
    return imagePublicUrl(hero.storage_path);
  }

  function toggleType(t) {
    setActiveTypes((prev) => {
      const next = new Set(prev);
      next.has(t) ? next.delete(t) : next.add(t);
      return next;
    });
  }

  function openCreate() { setModal({ mode: "create" }); setSelectedId(null); }
  function openEdit(c) { setModal({ mode: "edit", campaign: c }); setSelectedId(null); }

  // stagedImages: [{ file, label }], stagedLinks: [{ label, url }] — only
  // relevant on create, where the campaign id doesn't exist until after
  // the insert. If the campaign insert fails, attachments are never
  // attempted.
  async function handleSubmit(data, editId, stagedImages, stagedLinks) {
    if (editId) {
      await updateCampaign(editId, data);
      setModal(null);
      return;
    }
    const row = await createCampaign(data);
    if (!row) { setModal(null); return; }
    setSelectedId(row.id);
    if (stagedImages && stagedImages.length) {
      await uploadImages(row.id, stagedImages.map((s) => ({ file: s.file, label: s.label })));
    }
    if (stagedLinks && stagedLinks.length) {
      for (const l of stagedLinks) await addLink(row.id, l.label, l.url);
    }
    setModal(null);
  }

  return (
    <React.Fragment>
      <div className={"sync-bar " + sync.state}>{sync.message}</div>

      <TopBar stats={stats} onNew={openCreate} />

      <Toolbar
        view={view} setView={setView}
        search={search} setSearch={setSearch}
        activeStatus={activeStatus} setActiveStatus={setActiveStatus}
        activeTypes={activeTypes} toggleType={toggleType}
        typeCounts={typeCounts}
      />

      <div className="content">
        {loading ? (
          <div className="loading-box"><div className="spinner"></div><div>Caricamento campagne...</div></div>
        ) : view === "timeline" ? (
          <TimelineView campaigns={filtered} selectedId={selectedId} onSelect={setSelectedId} getThumbUrl={getThumbUrl} />
        ) : (
          <GridView campaigns={filtered} selectedId={selectedId} onSelect={setSelectedId} getThumbUrl={getThumbUrl} />
        )}
        <Legend />
      </div>

      {selected && !modal && (
        <DetailPanel
          campaign={selected}
          images={imagesByCampaign[selected.id] || []}
          links={linksByCampaign[selected.id] || []}
          getImageUrl={imagePublicUrl}
          onUploadImages={(files) => uploadImages(selected.id, files.map((f) => ({ file: f, label: "" })))}
          onUpdateImageLabel={updateImageLabel}
          onDeleteImage={deleteImage}
          onAddLink={(label, url) => addLink(selected.id, label, url)}
          onDeleteLink={deleteLink}
          onClose={() => setSelectedId(null)}
          onEdit={() => openEdit(selected)}
          onDuplicate={() => duplicateCampaign(selected)}
          onDelete={() => setDeleteTarget(selected)}
        />
      )}

      {modal && (
        <CampaignModal
          initial={modal.mode === "edit" ? modal.campaign : emptyForm()}
          editId={modal.mode === "edit" ? modal.campaign.id : null}
          campaignImages={modal.mode === "edit" ? (imagesByCampaign[modal.campaign.id] || []) : []}
          campaignLinks={modal.mode === "edit" ? (linksByCampaign[modal.campaign.id] || []) : []}
          getImageUrl={imagePublicUrl}
          onUploadImages={uploadImages}
          onUpdateImageLabel={updateImageLabel}
          onDeleteImage={deleteImage}
          onAddLink={addLink}
          onDeleteLink={deleteLink}
          onCancel={() => setModal(null)}
          onSubmit={handleSubmit}
        />
      )}

      {deleteTarget && (
        <ConfirmDeleteModal
          campaign={deleteTarget}
          onCancel={() => setDeleteTarget(null)}
          onConfirm={async () => { await deleteCampaign(deleteTarget.id); setDeleteTarget(null); }}
        />
      )}
    </React.Fragment>
  );
}

/* ── TOPBAR ─────────────────────────────────────────── */
function TopBar({ stats, onNew }) {
  return (
    <div className="topbar">
      <div className="topbar-inner">
        <div className="topbar-left">
          <img src="logo.png" alt="CappellettoShop" className="topbar-logo" />
          <div className="topbar-title">
            <h1>Calendario Campagne Email</h1>
            <span>Agosto – Dicembre 2026</span>
          </div>
        </div>
        <button className="btn-new" onClick={onNew}>
          <span style={{ fontSize: 16, lineHeight: 1 }}>+</span> Nuova Campagna
        </button>
      </div>
      <div className="topbar-stats">
        <span><strong>{stats.total}</strong> campagne totali</span>
        <span className="sep">|</span>
        <span><strong style={{ color: STATUSES.confirmed.color }}>{stats.confirmed}</strong> confermate</span>
        <span className="sep">|</span>
        <span><strong style={{ color: STATUSES.planned.color }}>{stats.planned}</strong> pianificate</span>
        <span className="sep">|</span>
        <span><strong style={{ color: STATUSES.tbd.color }}>{stats.tbd}</strong> da confermare</span>
      </div>
    </div>
  );
}

/* ── TOOLBAR ────────────────────────────────────────── */
function Toolbar({ view, setView, search, setSearch, activeStatus, setActiveStatus, activeTypes, toggleType, typeCounts }) {
  return (
    <div className="toolbar">
      <div className="toolbar-inner">
        <input
          className="search-input"
          placeholder="Cerca campagna..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <div className="view-toggle">
          <button className={"btn-toggle" + (view === "timeline" ? " active" : "")} onClick={() => setView("timeline")}>Timeline</button>
          <button className={"btn-toggle" + (view === "grid" ? " active" : "")} onClick={() => setView("grid")}>Griglia</button>
        </div>
        <div className="status-group">
          {["all", "confirmed", "planned", "tbd"].map((s) => (
            <button
              key={s}
              className={"btn-status" + (activeStatus === s ? " active" : "")}
              onClick={() => setActiveStatus(s)}
            >
              {s === "all" ? "Tutti" : STATUSES[s].label}
            </button>
          ))}
        </div>
      </div>
      <div className="type-pills">
        {Object.entries(TYPES).map(([key, cfg]) => (
          <button
            key={key}
            className={"type-pill" + (activeTypes.has(key) ? " active" : "")}
            onClick={() => toggleType(key)}
          >
            {cfg.label}
            <span className="count">({typeCounts[key] || 0})</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ── TIMELINE VIEW ──────────────────────────────────── */
function TimelineView({ campaigns, selectedId, onSelect, getThumbUrl }) {
  return (
    <React.Fragment>
      {MONTHS.map((m) => {
        const items = campaigns.filter((c) => c.month === m.n).sort((a, b) => a.day - b.day);
        return (
          <div className="month-section" key={m.n}>
            <div className="month-header">
              <h2>{m.name}</h2>
              <span className="count">{items.length} campagn{items.length === 1 ? "a" : "e"}</span>
            </div>
            {items.length === 0 ? (
              <div className="month-empty">Nessuna campagna pianificata</div>
            ) : (
              <div className="campaign-list">
                {items.map((c) => {
                  const tc = typeOf(c);
                  const thumbUrl = getThumbUrl(c.id);
                  return (
                    <button
                      key={c.id}
                      className={"campaign-row" + (selectedId === c.id ? " selected" : "")}
                      style={statusBorderLeft(c.status)}
                      onClick={() => onSelect(selectedId === c.id ? null : c.id)}
                    >
                      <span className="day">{String(c.day).padStart(2, "0")}{c.end_day ? "–" + String(c.end_day).padStart(2, "0") : ""}</span>
                      {thumbUrl && <img src={thumbUrl} className="thumb" alt="" />}
                      <span className="type-badge">{tc.label}</span>
                      <span className="name">{c.label}</span>
                      <span className="status-dot" style={statusDotStyle(c.status)}></span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </React.Fragment>
  );
}

/* ── GRID VIEW ──────────────────────────────────────── */
function GridView({ campaigns, selectedId, onSelect, getThumbUrl }) {
  return (
    <div className="grid">
      {MONTHS.map((m) => {
        const items = campaigns.filter((c) => c.month === m.n).sort((a, b) => a.day - b.day);
        return (
          <div className="grid-card" key={m.n}>
            <div className="grid-card-header">
              <span className="name">{m.name}</span>
              <span className="count">{items.length}</span>
            </div>
            {items.length === 0 ? (
              <div className="grid-empty">Nessuna campagna</div>
            ) : (
              items.map((c) => {
                const thumbUrl = getThumbUrl(c.id);
                return (
                  <button
                    key={c.id}
                    className="grid-row"
                    style={{ ...statusBorderLeft(c.status), background: selectedId === c.id ? "#f8f8f8" : "none" }}
                    onClick={() => onSelect(selectedId === c.id ? null : c.id)}
                  >
                    <span className="day">{c.day}</span>
                    {thumbUrl && <img src={thumbUrl} className="thumb" alt="" />}
                    <span className="name">{c.label}</span>
                    <span className="status-dot" style={statusDotStyle(c.status)}></span>
                  </button>
                );
              })
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── LEGEND ─────────────────────────────────────────── */
function Legend() {
  return (
    <div className="legend">
      <div className="legend-title">Legenda stati</div>
      <div className="legend-items">
        {Object.entries(STATUSES).map(([key, cfg]) => (
          <div className="legend-item" key={key}>
            <span className="legend-dot" style={statusDotStyle(key)}></span>
            {cfg.label}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── DETAIL PANEL ───────────────────────────────────── */
function DetailPanel({
  campaign, images, links, getImageUrl,
  onUploadImages, onUpdateImageLabel, onDeleteImage,
  onAddLink, onDeleteLink,
  onClose, onEdit, onDuplicate, onDelete,
}) {
  const tc = typeOf(campaign), sc = statusOf(campaign);
  const month = MONTHS.find((m) => m.n === campaign.month);
  const [lightbox, setLightbox] = useState(null);
  const [linkForm, setLinkForm] = useState({ label: "", url: "" });

  function handleFiles(e) {
    const files = [...e.target.files];
    e.target.value = "";
    if (files.length) onUploadImages(files);
  }

  function submitLink() {
    if (!linkForm.url.trim()) return;
    onAddLink(linkForm.label, linkForm.url);
    setLinkForm({ label: "", url: "" });
  }

  return (
    <div className="detail-panel" style={statusBorderTop(campaign.status)}>
      <div className="detail-inner">
        <div className="detail-top">
          <div>
            <div className="detail-meta">
              <span className="type-badge">{tc.label}</span>
              <span
                className="status-tag"
                style={{ "--status-color": sc.color, borderStyle: campaign.status === "planned" ? "dashed" : "solid" }}
              >
                {sc.label}
              </span>
            </div>
            <div className="detail-title">{campaign.label}</div>
          </div>
          <div className="detail-actions">
            <button className="btn-icon" onClick={onEdit} title="Modifica">✎ Modifica</button>
            <button className="btn-icon" onClick={onDuplicate} title="Duplica">⧉ Duplica</button>
            <button className="btn-icon danger" onClick={onDelete} title="Elimina">✕ Elimina</button>
            <button className="btn-icon" onClick={onClose} title="Chiudi">↓</button>
          </div>
        </div>
        <div className="detail-date">
          Data: <strong>{campaign.day}{campaign.end_day ? "–" + campaign.end_day : ""} {month ? month.name : ""} 2026</strong>
        </div>
        {campaign.notes && (
          <div className="detail-notes">
            <span className="detail-notes-label">Descrizione / Note</span>
            {campaign.notes}
          </div>
        )}

        <div className="detail-section">
          <div className="detail-section-label">
            Immagini
            <label className="upload-btn">
              + Aggiungi
              <input type="file" accept="image/*" multiple onChange={handleFiles} />
            </label>
          </div>
          {images.length === 0 ? (
            <div className="detail-section-empty">Nessuna immagine allegata</div>
          ) : (
            <div className="gallery">
              {images.map((img) => (
                <div className="gallery-item" key={img.id}>
                  <div className="gallery-thumb-wrap">
                    <img src={getImageUrl(img.storage_path)} alt={img.label || ""} onClick={() => setLightbox(img)} />
                    <div className="gallery-thumb-actions">
                      <button
                        className="gallery-icon-btn"
                        title="Scarica"
                        onClick={() => downloadFile(getImageUrl(img.storage_path), (img.label || "immagine") + ".jpg")}
                      >
                        ⬇
                      </button>
                      <button
                        className="gallery-icon-btn danger"
                        title="Elimina"
                        onClick={() => onDeleteImage(img)}
                      >
                        ✕
                      </button>
                    </div>
                  </div>
                  <input
                    className="gallery-label-input"
                    value={img.label}
                    placeholder="Etichetta"
                    onChange={(e) => onUpdateImageLabel(img.id, e.target.value)}
                  />
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="detail-section">
          <div className="detail-section-label">Link</div>
          {links.length > 0 && (
            <div className="links-list">
              {links.map((l) => (
                <div className="link-item" key={l.id}>
                  <span className="link-label">{l.label || "Link"}</span>
                  <a href={l.url} target="_blank" rel="noopener noreferrer">{l.url}</a>
                  <button className="link-remove" title="Rimuovi" onClick={() => onDeleteLink(l.id)}>✕</button>
                </div>
              ))}
            </div>
          )}
          <div className="link-add-row">
            <input
              className="link-label-input"
              placeholder="Etichetta (es. Figma)"
              value={linkForm.label}
              onChange={(e) => setLinkForm((f) => ({ ...f, label: e.target.value }))}
            />
            <input
              className="link-url-input"
              placeholder="https://..."
              value={linkForm.url}
              onChange={(e) => setLinkForm((f) => ({ ...f, url: e.target.value }))}
              onKeyDown={(e) => { if (e.key === "Enter") submitLink(); }}
            />
            <button className="link-add-btn" onClick={submitLink}>+ Aggiungi</button>
          </div>
        </div>
      </div>

      {lightbox && (
        <div className="lightbox-overlay" onClick={() => setLightbox(null)}>
          <button className="lightbox-close" onClick={() => setLightbox(null)}>✕</button>
          <img src={getImageUrl(lightbox.storage_path)} alt={lightbox.label || ""} onClick={(e) => e.stopPropagation()} />
          <div className="lightbox-caption" onClick={(e) => e.stopPropagation()}>
            <span>{lightbox.label || "Senza etichetta"}</span>
            <button
              className="btn"
              onClick={() => downloadFile(getImageUrl(lightbox.storage_path), (lightbox.label || "immagine") + ".jpg")}
            >
              ⬇ Scarica
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── CAMPAIGN MODAL (create / edit) ─────────────────── */
// Product-relevant placeholder examples (vs. a generic "Figma"-style hint)
// cycled across staged image/link label inputs.
const IMAGE_LABEL_EXAMPLES = ["Scheda prodotto", "Foto packaging", "Foto lifestyle", "Dettaglio prodotto", "Hero"];
const LINK_LABEL_PLACEHOLDER = "es. Scheda prodotto";

function CampaignModal({
  initial, editId, onCancel, onSubmit,
  campaignImages, campaignLinks, getImageUrl,
  onUploadImages, onUpdateImageLabel, onDeleteImage,
  onAddLink, onDeleteLink,
}) {
  const [form, setForm] = useState({
    label: initial.label || "",
    type: initial.type || "newsletter",
    status: initial.status || "tbd",
    month: initial.month || 8,
    day: initial.day || 1,
    end_day: initial.end_day || "",
    notes: initial.notes || "",
  });
  const [stagedImages, setStagedImages] = useState([]);
  const [stagedLinks, setStagedLinks] = useState([]);
  const [saving, setSaving] = useState(false);

  // Revoke any leftover local preview URLs when the modal unmounts so we
  // don't leak blob: URLs for images that were never uploaded. Uses a ref
  // so this only fires once, on unmount — not on every staged-image change.
  const stagedImagesRef = useRef(stagedImages);
  useEffect(() => { stagedImagesRef.current = stagedImages; }, [stagedImages]);
  useEffect(() => {
    return () => { stagedImagesRef.current.forEach((it) => URL.revokeObjectURL(it.previewUrl)); };
  }, []);

  function set(field, value) { setForm((prev) => ({ ...prev, [field]: value })); }

  async function submit(e) {
    e.preventDefault();
    if (!form.label.trim() || saving) return;
    setSaving(true);
    await onSubmit({
      label: form.label.trim(),
      type: form.type,
      status: form.status,
      month: parseInt(form.month, 10),
      day: parseInt(form.day, 10) || 1,
      end_day: form.end_day ? parseInt(form.end_day, 10) : null,
      notes: form.notes.trim(),
    }, editId, stagedImages, stagedLinks);
    setSaving(false);
  }

  const tc = TYPES[form.type], sc = STATUSES[form.status];

  return (
    <div className="overlay" onClick={saving ? undefined : onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h2>{editId ? "Modifica Campagna" : "Nuova Campagna"}</h2>
        </div>
        <form onSubmit={submit}>
          <div className="modal-body">
            <div className="preview-box">
              <div className="preview-label">Anteprima</div>
              <div className="preview-row" style={statusBorderLeft(form.status)}>
                <span className="day">{String(form.day || 1).padStart(2, "0")}{form.end_day ? "–" + String(form.end_day).padStart(2, "0") : ""}</span>
                <span className="type-badge">{tc.label}</span>
                <span className="name">{form.label || "Nome campagna"}</span>
                <span className="status-dot" style={statusDotStyle(form.status)}></span>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Nome campagna *</label>
              <input className="form-input" value={form.label} onChange={(e) => set("label", e.target.value)} placeholder="es. Lancio Collezione Autunno" autoFocus />
            </div>

            <div className="form-group form-row form-row-2">
              <div>
                <label className="form-label">Tipo</label>
                <select className="form-select" value={form.type} onChange={(e) => set("type", e.target.value)}>
                  {Object.entries(TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
              </div>
              <div>
                <label className="form-label">Stato</label>
                <select className="form-select" value={form.status} onChange={(e) => set("status", e.target.value)}>
                  {Object.entries(STATUSES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
              </div>
            </div>

            <div className="form-group form-row form-row-3">
              <div>
                <label className="form-label">Mese</label>
                <select className="form-select" value={form.month} onChange={(e) => set("month", e.target.value)}>
                  {MONTHS.map((m) => <option key={m.n} value={m.n}>{m.name}</option>)}
                </select>
              </div>
              <div>
                <label className="form-label">Giorno</label>
                <input className="form-input" type="number" min="1" max="31" value={form.day} onChange={(e) => set("day", e.target.value)} />
              </div>
              <div>
                <label className="form-label">Fine (opz.)</label>
                <input className="form-input" type="number" min="1" max="31" value={form.end_day} onChange={(e) => set("end_day", e.target.value)} placeholder="—" />
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Descrizione / Note</label>
              <textarea className="form-textarea" value={form.notes} onChange={(e) => set("notes", e.target.value)} placeholder="Dettagli, obiettivi, coordinamento..."></textarea>
            </div>

            <div className="form-group">
              <label className="form-label">Immagini</label>
              {editId ? (
                <ModalImageGallery
                  images={campaignImages}
                  getImageUrl={getImageUrl}
                  onUpload={(files) => onUploadImages(editId, files.map((f) => ({ file: f, label: "" })))}
                  onUpdateLabel={onUpdateImageLabel}
                  onDelete={onDeleteImage}
                />
              ) : (
                <StagedImagesEditor staged={stagedImages} setStaged={setStagedImages} />
              )}
            </div>

            <div className="form-group">
              <label className="form-label">Link</label>
              {editId ? (
                <ModalLinksSection
                  links={campaignLinks}
                  onAdd={(label, url) => onAddLink(editId, label, url)}
                  onDelete={onDeleteLink}
                />
              ) : (
                <StagedLinksEditor staged={stagedLinks} setStaged={setStagedLinks} />
              )}
            </div>
          </div>
          <div className="modal-footer">
            <button type="button" className="btn" onClick={onCancel} disabled={saving}>Annulla</button>
            <button type="submit" className="btn btn-primary" disabled={saving}>
              {saving ? "Salvataggio..." : (editId ? "Salva Modifiche" : "Aggiungi Campagna")}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ── STAGED IMAGES (create mode: local only until campaign is saved) ── */
function StagedImagesEditor({ staged, setStaged }) {
  function handleFiles(e) {
    const files = [...e.target.files];
    e.target.value = "";
    const newItems = files.map((file) => ({
      key: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
      file,
      label: "",
      previewUrl: URL.createObjectURL(file),
    }));
    setStaged((prev) => [...prev, ...newItems]);
  }

  function updateLabel(key, label) {
    setStaged((prev) => prev.map((it) => (it.key === key ? { ...it, label } : it)));
  }

  function remove(key) {
    setStaged((prev) => {
      const target = prev.find((it) => it.key === key);
      if (target) URL.revokeObjectURL(target.previewUrl);
      return prev.filter((it) => it.key !== key);
    });
  }

  return (
    <div>
      <div className="staged-header">
        <span className="staged-count">
          {staged.length === 0
            ? "Verranno caricate al salvataggio"
            : staged.length + (staged.length === 1 ? " immagine selezionata" : " immagini selezionate")}
        </span>
        <label className="upload-btn">
          + Aggiungi
          <input type="file" accept="image/*" multiple onChange={handleFiles} />
        </label>
      </div>
      {staged.length > 0 && (
        <div className="gallery">
          {staged.map((it, idx) => (
            <div className="gallery-item" key={it.key}>
              <div className="gallery-thumb-wrap">
                <img src={it.previewUrl} alt="" />
                <div className="gallery-thumb-actions">
                  <button type="button" className="gallery-icon-btn danger" title="Rimuovi" onClick={() => remove(it.key)}>✕</button>
                </div>
              </div>
              <input
                type="text"
                className="gallery-label-input"
                value={it.label}
                placeholder={IMAGE_LABEL_EXAMPLES[idx % IMAGE_LABEL_EXAMPLES.length]}
                onChange={(e) => updateLabel(it.key, e.target.value)}
              />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── STAGED LINKS (create mode: local only until campaign is saved) ── */
function StagedLinksEditor({ staged, setStaged }) {
  const [form, setForm] = useState({ label: "", url: "" });

  function add() {
    if (!form.url.trim()) return;
    setStaged((prev) => [...prev, { key: Date.now() + "-" + Math.random().toString(36).slice(2, 8), label: form.label.trim(), url: form.url.trim() }]);
    setForm({ label: "", url: "" });
  }

  function remove(key) {
    setStaged((prev) => prev.filter((l) => l.key !== key));
  }

  return (
    <div>
      {staged.length > 0 && (
        <div className="links-list">
          {staged.map((l) => (
            <div className="link-item" key={l.key}>
              <span className="link-label">{l.label || "Link"}</span>
              <span style={{ flex: 1, fontSize: 13, color: "#1a1a1a", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.url}</span>
              <button type="button" className="link-remove" title="Rimuovi" onClick={() => remove(l.key)}>✕</button>
            </div>
          ))}
        </div>
      )}
      <div className="link-add-row">
        <input
          type="text"
          className="link-label-input"
          placeholder={LINK_LABEL_PLACEHOLDER}
          value={form.label}
          onChange={(e) => setForm((f) => ({ ...f, label: e.target.value }))}
        />
        <input
          type="text"
          className="link-url-input"
          placeholder="https://..."
          value={form.url}
          onChange={(e) => setForm((f) => ({ ...f, url: e.target.value }))}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } }}
        />
        <button type="button" className="link-add-btn" onClick={add}>+ Aggiungi</button>
      </div>
    </div>
  );
}

/* ── MODAL IMAGE GALLERY (edit mode: persisted, immediate actions) ── */
function ModalImageGallery({ images, getImageUrl, onUpload, onUpdateLabel, onDelete }) {
  function handleFiles(e) {
    const files = [...e.target.files];
    e.target.value = "";
    if (files.length) onUpload(files);
  }

  return (
    <div>
      <div className="staged-header">
        <span className="staged-count">{images.length === 0 ? "Nessuna immagine allegata" : images.length + (images.length === 1 ? " immagine" : " immagini")}</span>
        <label className="upload-btn">
          + Aggiungi
          <input type="file" accept="image/*" multiple onChange={handleFiles} />
        </label>
      </div>
      {images.length > 0 && (
        <div className="gallery">
          {images.map((img) => (
            <div className="gallery-item" key={img.id}>
              <div className="gallery-thumb-wrap">
                <img src={getImageUrl(img.storage_path)} alt={img.label || ""} />
                <div className="gallery-thumb-actions">
                  <button
                    type="button"
                    className="gallery-icon-btn"
                    title="Scarica"
                    onClick={() => downloadFile(getImageUrl(img.storage_path), (img.label || "immagine") + ".jpg")}
                  >
                    ⬇
                  </button>
                  <button type="button" className="gallery-icon-btn danger" title="Elimina" onClick={() => onDelete(img)}>✕</button>
                </div>
              </div>
              <input
                type="text"
                className="gallery-label-input"
                value={img.label}
                placeholder="es. Scheda prodotto"
                onChange={(e) => onUpdateLabel(img.id, e.target.value)}
              />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── MODAL LINKS SECTION (edit mode: persisted, immediate actions) ── */
function ModalLinksSection({ links, onAdd, onDelete }) {
  const [form, setForm] = useState({ label: "", url: "" });

  function submitLink() {
    if (!form.url.trim()) return;
    onAdd(form.label, form.url);
    setForm({ label: "", url: "" });
  }

  return (
    <div>
      {links.length > 0 && (
        <div className="links-list">
          {links.map((l) => (
            <div className="link-item" key={l.id}>
              <span className="link-label">{l.label || "Link"}</span>
              <a href={l.url} target="_blank" rel="noopener noreferrer">{l.url}</a>
              <button type="button" className="link-remove" title="Rimuovi" onClick={() => onDelete(l.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
      <div className="link-add-row">
        <input
          type="text"
          className="link-label-input"
          placeholder={LINK_LABEL_PLACEHOLDER}
          value={form.label}
          onChange={(e) => setForm((f) => ({ ...f, label: e.target.value }))}
        />
        <input
          type="text"
          className="link-url-input"
          placeholder="https://..."
          value={form.url}
          onChange={(e) => setForm((f) => ({ ...f, url: e.target.value }))}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); submitLink(); } }}
        />
        <button type="button" className="link-add-btn" onClick={submitLink}>+ Aggiungi</button>
      </div>
    </div>
  );
}

/* ── DELETE CONFIRM MODAL ───────────────────────────── */
function ConfirmDeleteModal({ campaign, onCancel, onConfirm }) {
  return (
    <div className="overlay" onClick={onCancel}>
      <div className="modal modal-sm" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <h2>Eliminare "{campaign.label}"?</h2>
        </div>
        <div className="modal-body">
          <p style={{ fontSize: 13, color: "#888" }}>Questa azione non può essere annullata.</p>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel}>Annulla</button>
          <button className="btn btn-danger" onClick={onConfirm}>Elimina</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
