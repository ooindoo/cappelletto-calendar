<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CappellettoShop — Calendario Campagne</title>
<link rel="icon" href="logo.png">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #1a1a1a; font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .6; }

  .sync-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 700; padding: 6px 16px; font-size: 11px; text-align: center; transition: all .3s; }
  .sync-bar.connected { background: rgba(46,125,50,.08); color: #2E7D32; }
  .sync-bar.syncing { background: rgba(21,101,192,.08); color: #1565C0; }
  .sync-bar.error { background: rgba(198,40,40,.1); color: #C62828; }
  .sync-bar.hidden { transform: translateY(-100%); opacity: 0; }

  /* ── TOPBAR ─────────────────────────────── */
  .topbar { background: #1a1a1a; color: #fff; }
  .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar-logo { height: 26px; display: block; filter: brightness(0) invert(1); }
  .topbar-title { display: flex; flex-direction: column; gap: 2px; }
  .topbar-title h1 { font-size: 14px; font-weight: 600; letter-spacing: .04em; color: #fff; }
  .topbar-title span { font-size: 11px; color: #888; letter-spacing: .02em; }
  .btn-new { background: #2a2a2a; border: 1px solid #333; color: #fff; padding: 10px 18px; font-size: 13px; font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s; }
  .btn-new:hover { background: #333; border-color: #444; }
  .topbar-stats { max-width: 1200px; margin: 0 auto; padding: 0 32px 16px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: #888; }
  .topbar-stats strong { color: #fff; font-weight: 700; }
  .topbar-stats .sep { color: #444; }
  .topbar-stats .warn strong, .topbar-stats .warn { color: #FB8C00; }
  .main-tabs { max-width: 1200px; margin: 0 auto; padding: 0 32px; display: flex; gap: 28px; border-top: 1px solid #2a2a2a; }
  .main-tab { background: none; border: none; border-bottom: 2px solid transparent; color: #888; font-size: 13px; font-weight: 500; letter-spacing: .03em; padding: 13px 0 11px; transition: color .12s; }
  .main-tab:hover { color: #fff; }
  .main-tab.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }
  .main-tab .count { color: #666; font-weight: 400; margin-left: 6px; }

  /* ── TOOLBAR ────────────────────────────── */
  .toolbar { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid #e8e8e8; }
  .toolbar-inner { max-width: 1200px; margin: 0 auto; padding: 16px 32px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search-input { padding: 8px 12px; border: 1px solid #e8e8e8; background: #fff; color: #1a1a1a; outline: none; width: 200px; transition: border-color .12s; }
  .search-input:focus { border-color: #1a1a1a; }
  .search-input::placeholder { color: #aaa; }
  .view-toggle { display: flex; border: 1px solid #e8e8e8; }
  .btn-toggle { padding: 8px 14px; background: #fff; border: none; border-right: 1px solid #e8e8e8; font-size: 12px; font-weight: 500; color: #888; transition: background .12s, color .12s; }
  .btn-toggle:last-child { border-right: none; }
  .btn-toggle.active { background: #1a1a1a; color: #fff; }
  .btn-toggle:not(.active):hover { color: #1a1a1a; background: #f8f8f8; }
  .status-group { display: flex; gap: 4px; }
  .btn-status { padding: 8px 12px; background: #fff; border: 1px solid #e8e8e8; font-size: 12px; font-weight: 500; color: #888; transition: border-color .12s, color .12s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-status:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .btn-status.active { border-color: #1a1a1a; color: #1a1a1a; background: #f8f8f8; font-weight: 700; }
  .btn-status .status-dot { width: 7px; height: 7px; }
  .group-sep { width: 1px; align-self: stretch; background: #e8e8e8; margin: 0 4px; }
  .type-pills { max-width: 1200px; margin: 0 auto; padding: 0 32px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .type-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 6px 12px; border: 1px solid #e8e8e8; background: #fff; color: #888; transition: border-color .12s, color .12s, background .12s; }
  .type-pill.active { border-color: #1a1a1a; color: #1a1a1a; background: #f8f8f8; font-weight: 700; }
  .type-pill .count { color: #bbb; font-weight: 400; }
  .type-pill.active .count { color: #999; }
  .type-pill:hover { border-color: #1a1a1a; color: #1a1a1a; }

  /* Neutral type badge — color is reserved for status only */
  .type-badge { display: inline-block; min-width: 150px; box-sizing: border-box; text-align: center; border: 1px solid #ddd; border-radius: 20px; padding: 2px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #777; white-space: nowrap; background: #fff; flex-shrink: 0; }
  .seg-chip { display: inline-block; min-width: 54px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #1a1a1a; border: 1px solid #1a1a1a; padding: 2px 6px; white-space: nowrap; flex-shrink: 0; }
  .seg-chip.empty { visibility: hidden; }
  .fmt-chip { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border: 1px solid #ddd; border-radius: 20px; padding: 1px 8px; color: #777; background: #fff; white-space: nowrap; }

  /* ── CONTENT ────────────────────────────── */
  .content { max-width: 1200px; margin: 0 auto; padding: 28px 32px 120px; }
  .month-section { margin-bottom: 30px; }
  .month-header { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid #e8e8e8; }
  .month-header h2 { font-size: 16px; font-weight: 700; color: #1a1a1a; letter-spacing: .01em; }
  .month-header .count { font-size: 12px; color: #aaa; }
  .month-now { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #fff; background: #1a1a1a; padding: 2px 7px; }
  .month-empty { font-size: 12px; color: #ccc; font-style: italic; padding: 8px 2px 2px; }
  .week-label { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
  .today-line { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 10px; font-weight: 700; color: #1a1a1a; text-transform: uppercase; letter-spacing: .1em; }
  .today-line::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #1a1a1a; flex-shrink: 0; }
  .today-line::after { content: ""; flex: 1; height: 2px; background: #1a1a1a; }
  .past-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 24px; background: #f8f8f8; border: 1px dashed #ddd; font-size: 12px; color: #888; text-align: left; }
  .past-toggle strong { color: #1a1a1a; }
  .past-toggle:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .past-toggle .warn { color: #E65100; font-weight: 600; }

  .campaign-list { display: flex; flex-direction: column; gap: 4px; }
  .campaign-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; background: #fff; border: 1px solid #e8e8e8; border-left: 3px solid #ccc; cursor: pointer; width: 100%; text-align: left; transition: background .12s, border-color .12s, opacity .12s; box-sizing: border-box; outline: none; }
  .campaign-row:hover { background: #f8f8f8; }
  .campaign-row:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 1px; }
  .campaign-row.selected { background: #f8f8f8; border-color: #1a1a1a; }
  .campaign-row.is-past { opacity: .55; }
  .campaign-row.is-past:hover, .campaign-row.is-past.selected { opacity: 1; }
  .campaign-row .day { font-size: 12px; color: #888; font-variant-numeric: tabular-nums; min-width: 66px; white-space: nowrap; }
  .campaign-row .day b { color: #1a1a1a; font-weight: 600; margin-right: 3px; }
  .campaign-row .name { font-size: 13px; font-weight: 500; color: #1a1a1a; flex: 1; min-width: 0; }
  .thumb-slot { width: 26px; height: 26px; flex-shrink: 0; display: inline-flex; }
  .thumb { width: 26px; height: 26px; object-fit: cover; border: 1px solid #e8e8e8; flex-shrink: 0; background: #f8f8f8; }
  .past-flag { display: inline-block; margin-left: 8px; font-size: 10px; font-weight: 700; color: #E65100; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .linked-count { font-size: 11px; color: #888; white-space: nowrap; flex-shrink: 0; }

  .status-dot { border-radius: 50%; border: 1.5px solid transparent; box-sizing: border-box; display: inline-block; }
  .status-wrap { position: relative; flex-shrink: 0; display: inline-flex; }
  .status-btn { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid transparent; padding: 0; }
  .status-btn:hover { border-color: #e8e8e8; background: #fff; }
  .status-btn .status-dot { width: 9px; height: 9px; }
  .status-menu { position: absolute; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid #1a1a1a; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 300; min-width: 180px; padding: 4px 0; }
  .status-menu-title { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .08em; padding: 6px 14px 4px; }
  .status-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 14px; background: none; border: none; font-size: 12px; color: #1a1a1a; text-align: left; }
  .status-menu button:hover { background: #f8f8f8; }
  .status-menu button.current { font-weight: 700; }
  .status-menu .status-dot { width: 8px; height: 8px; flex-shrink: 0; }

  /* ── CALENDAR (month grid) ──────────────── */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .cal-title { font-size: 18px; font-weight: 700; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { min-width: 36px; height: 34px; padding: 0 12px; background: #fff; border: 1px solid #e8e8e8; font-size: 13px; color: #1a1a1a; }
  .cal-nav button:hover { border-color: #1a1a1a; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #e8e8e8; border-left: 1px solid #e8e8e8; }
  .cal-dow { padding: 8px; font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .08em; border-right: 1px solid #e8e8e8; border-bottom: 1px solid #e8e8e8; background: #f8f8f8; }
  .cal-cell { position: relative; min-height: 112px; padding: 6px; border-right: 1px solid #e8e8e8; border-bottom: 1px solid #e8e8e8; background: #fff; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
  .cal-cell.other { background: #fbfbfb; }
  .cal-cell.other .cal-daynum .n { color: #ccc; }
  .cal-cell.drop { background: #f3f3f3; outline: 2px dashed #1a1a1a; outline-offset: -3px; }
  .cal-cell.selected-day { outline: 2px solid #1a1a1a; outline-offset: -2px; }
  .cal-daynum { font-size: 11px; color: #888; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; align-items: center; height: 22px; }
  .cal-daynum .n { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
  .cal-cell.today .cal-daynum .n { background: #1a1a1a; color: #fff; border-radius: 50%; font-weight: 700; }
  .cal-add { opacity: 0; background: #fff; border: 1px solid #e8e8e8; width: 22px; height: 22px; font-size: 13px; color: #888; line-height: 1; padding: 0; }
  .cal-cell:hover .cal-add { opacity: 1; }
  .cal-add:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .cal-chip { display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0; padding: 3px 5px; font-size: 11px; text-align: left; background: #fff; border: 1px solid #e8e8e8; border-left: 3px solid #ccc; color: #1a1a1a; }
  .cal-chip:hover { border-color: #1a1a1a; }
  .cal-chip.is-past { opacity: .55; }
  .cal-chip.selected { border-color: #1a1a1a; background: #f8f8f8; opacity: 1; }
  .cal-chip .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-chip .s { font-size: 9px; font-weight: 700; color: #888; flex-shrink: 0; letter-spacing: .04em; }
  .cal-chip.social { border-style: dashed; border-left: 3px dashed #999; color: #555; background: #fcfcfc; }
  .cal-chip[draggable="true"] { cursor: grab; }
  .cal-more { font-size: 10px; color: #888; padding: 0 2px; }
  .cal-dots { display: none; }
  .cal-hint { font-size: 11px; color: #aaa; margin-top: 10px; }
  .day-list { margin-top: 20px; }
  .day-list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #e8e8e8; }
  .day-list-head h3 { font-size: 14px; font-weight: 700; }
  .social-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px dashed #ccc; background: #fcfcfc; cursor: pointer; width: 100%; text-align: left; font-size: 13px; color: #1a1a1a; }
  .social-row:hover { border-color: #1a1a1a; }

  /* ── LEGEND ─────────────────────────────── */
  .legend { margin-top: 32px; padding-top: 20px; border-top: 1px solid #e8e8e8; }
  .legend-title { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; }
  .legend-items { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: #888; }
  .legend-item { display: flex; gap: 6px; align-items: center; }
  .legend-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; border: 1.5px solid transparent; box-sizing: border-box; }
  .legend-note { font-size: 11px; color: #aaa; margin-top: 10px; }

  /* ── DETAIL PANEL ───────────────────────── */
  .detail-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 3px solid #ccc; box-shadow: 0 -8px 30px rgba(0,0,0,.12); z-index: 250; max-height: 46vh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
  .detail-inner { max-width: 1200px; margin: 0 auto; padding: 22px 32px 26px; }
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
  .detail-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .detail-meta .status-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border: 1px solid var(--status-color); color: var(--status-color); border-radius: 20px; }
  .detail-title { font-size: 19px; font-weight: 700; color: #1a1a1a; }
  .detail-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-icon { background: #fff; border: 1px solid #e8e8e8; color: #888; padding: 7px 11px; font-size: 13px; transition: border-color .12s, color .12s; }
  .btn-icon:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .btn-icon.danger:hover { border-color: #C62828; color: #C62828; }
  .detail-date { font-size: 12px; color: #888; margin-bottom: 12px; }
  .detail-date strong { color: #1a1a1a; font-weight: 600; }
  .detail-notes { padding: 12px 14px; background: #f8f8f8; border: 1px solid #e8e8e8; font-size: 13px; color: #555; line-height: 1.5; white-space: pre-wrap; }
  .detail-notes-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #aaa; display: block; margin-bottom: 6px; font-weight: 700; }
  .status-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
  .status-pills .lbl { font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 12px; background: #fff; border: 1px solid #e8e8e8; color: #888; }
  .status-pill:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .status-pill.active { color: #1a1a1a; font-weight: 700; border-color: #1a1a1a; }
  .status-pill .status-dot { width: 8px; height: 8px; }
  .linked-list { display: flex; flex-direction: column; gap: 6px; }
  .linked-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px dashed #ccc; background: #fcfcfc; width: 100%; text-align: left; font-size: 13px; color: #1a1a1a; }
  .linked-item:hover { border-color: #1a1a1a; }
  .linked-item .muted { color: #888; font-size: 11px; margin-left: auto; white-space: nowrap; }
  .link-btn { background: none; border: none; border-bottom: 1px solid #1a1a1a; padding: 0; font-size: 12px; color: #1a1a1a; font-weight: 600; }

  /* ── IMAGES + LINKS ─────────────────────── */
  .detail-section { margin-top: 18px; }
  .detail-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #aaa; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .detail-section-empty { font-size: 12px; color: #ccc; font-style: italic; }
  .upload-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px dashed #ccc; background: #fff; color: #888; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; transition: border-color .12s, color .12s; }
  .upload-btn:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .upload-btn input { display: none; }
  .gallery { display: flex; flex-wrap: wrap; gap: 12px; }
  .gallery-item { width: 96px; }
  .gallery-thumb-wrap { position: relative; width: 96px; height: 96px; border: 1px solid #e8e8e8; background: #f8f8f8; overflow: hidden; }
  .gallery-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .gallery-thumb-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; }
  .gallery-icon-btn { width: 20px; height: 20px; background: rgba(0,0,0,.65); color: #fff; border: none; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .gallery-icon-btn:hover { background: #1a1a1a; }
  .gallery-icon-btn.danger:hover { background: #C62828; }
  .gallery-label-input { width: 96px; box-sizing: border-box; margin-top: 4px; font-size: 11px; padding: 3px 5px; border: 1px solid transparent; background: transparent; color: #666; text-align: center; outline: none; }
  .gallery-label-input:hover, .gallery-label-input:focus { border-color: #e8e8e8; background: #fff; }
  .gallery-label-view { width: 96px; box-sizing: border-box; margin-top: 4px; font-size: 11px; padding: 3px 5px; color: #666; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .links-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .link-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid #e8e8e8; }
  .link-item .link-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #aaa; font-weight: 700; min-width: 90px; flex-shrink: 0; }
  .link-item a, .link-item .link-text { flex: 1; min-width: 0; font-size: 13px; color: #1a1a1a; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-item a:hover { text-decoration: underline; }
  .link-item .link-text { color: #888; }
  .bad-tag { font-size: 10px; font-weight: 700; color: #C62828; text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0; }
  .link-remove { background: none; border: none; color: #ccc; font-size: 13px; padding: 2px 4px; flex-shrink: 0; }
  .link-remove:hover { color: #C62828; }
  .link-add-row { display: flex; gap: 6px; }
  .link-add-row input { padding: 6px 9px; border: 1px solid #e8e8e8; font-size: 12px; outline: none; transition: border-color .12s; }
  .link-add-row input:focus { border-color: #1a1a1a; }
  .link-add-row input.invalid { border-color: #C62828; }
  .link-add-row .link-label-input { flex: 0 0 150px; }
  .link-add-row .link-url-input { flex: 1; min-width: 0; }
  .link-add-btn { padding: 6px 14px; border: 1px solid #1a1a1a; background: #1a1a1a; color: #fff; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .link-add-btn:hover { background: #333; }

  if (!t) return null;
  if (/entrambi|unisex|uomo e donna|donna e uomo|uomo\s*[\/+&]\s*donna|donna\s*[\/+&]\s*uomo/.test(t)) return "entrambi";
  const u = /\buom[oi]\b|\bmen\b/.test(t);
  const d = /\bdonn[ae]\b|\bwomen\b/.test(t);
  if (u && d) return "entrambi";
  if (u) return "uomo";
  if (d) return "donna";
  return null;
}
function detectFromText(label, notes) {
  const t = (label || "").toLowerCase();
  let type = null;
  for (const [k, re] of TYPE_RULES) { if (re.test(t)) { type = k; break; } }
  return { type, segment: detectSegment(label) || detectSegment(notes) };
}
function segmentOf(c) {
  if (c.segment && SEGMENTS[c.segment]) return c.segment;
  return detectSegment(c.label) || detectSegment(c.notes);
}
function segmentMatches(seg, filter) {
  if (filter === "all") return true;
  if (filter === "entrambi") return seg === "entrambi";
  return seg === filter || seg === "entrambi";
}

// Accepts full URLs and bare domains ("cappellettoshop.com/..."); rejects
// free text so a product name can't end up as a broken link.
function normalizeUrl(input) {
  const raw = (input || "").trim();
  if (!raw) return null;
  const candidate = /^https?:\/\//i.test(raw) ? raw : (/^[\w-]+(\.[\w-]+)+([\/?#]\S*)?$/.test(raw) ? "https://" + raw : null);
  if (!candidate || /\s/.test(candidate)) return null;
  try { const u = new URL(candidate); return u.hostname.includes(".") ? u.href : null; } catch (e) { return null; }
}
function isValidUrl(u) { return !!normalizeUrl(u); }

function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 1600;
  quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(objectUrl);
        blob ? resolve(blob) : reject(new Error("Compressione immagine fallita"));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("File immagine non valido")); };
    img.src = objectUrl;
  });
}

async function downloadFile(url, filename) {
  const res = await fetch(url);
  const blob = await res.blob();
  const objectUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = objectUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(objectUrl);
}

function imagePublicUrl(path) { return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl; }
function heroOf(imgs) {
  if (!imgs || !imgs.length) return null;
  return imgs.find((i) => (i.label || "").trim().toLowerCase() === "hero") || imgs[0];
}
function groupBy(arr, key) {
  const map = {};
  arr.forEach((x) => { (map[x[key]] = map[x[key]] || []).push(x); });
  Object.values(map).forEach((list) => list.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0) || a.id - b.id));
  return map;
}
function randomKey() { return Date.now() + "-" + Math.random().toString(36).slice(2, 8); }
function loadPref(k, fallback) { try { return localStorage.getItem(k) || fallback; } catch (e) { return fallback; } }
function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function useIsMobile() {
  const query = "(max-width: 700px)";
  const [m, setM] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const fn = () => setM(mq.matches);
    mq.addEventListener("change", fn);
    return () => mq.removeEventListener("change", fn);
  }, []);
  return m;
}

const IS_TOUCH = window.matchMedia("(hover: none)").matches;

// Freezes the page behind a modal. overflow:hidden alone isn't enough on
// iOS Safari, so the body is pinned in place and the scroll restored after.
function useBodyScrollLock(active) {
  useEffect(() => {
    if (!active) return;
    const y = window.scrollY;
    const s = document.body.style;
    const prev = { position: s.position, top: s.top, left: s.left, right: s.right, width: s.width, overflow: s.overflow };
    Object.assign(s, { position: "fixed", top: -y + "px", left: "0", right: "0", width: "100%", overflow: "hidden" });
    return () => { Object.assign(s, prev); window.scrollTo(0, y); };
  }, [active]);
}

function applyRealtime(setter) {
  return (payload) => {
    if (payload.eventType === "INSERT") setter((prev) => prev.some((x) => x.id === payload.new.id) ? prev : [...prev, payload.new]);
    else if (payload.eventType === "UPDATE") setter((prev) => prev.map((x) => (x.id === payload.new.id ? payload.new : x)));
    else if (payload.eventType === "DELETE") setter((prev) => prev.filter((x) => x.id !== payload.old.id));
  };
}

/* ── APP ────────────────────────────────────────────── */

  const [deleteTarget, setDeleteTarget] = useState(null);

  const showSync = (state, message) => setSync({ state, message });

  const load = useCallback(async () => {
    const [cRes, iRes, lRes, spRes, siRes, slRes] = await Promise.all([

      sb.from("social_posts").select("*"),
      sb.from("social_images").select("*").order("sort_order"),

    const sample = (cRes.data || [])[0];
    setSchema({
      year: sample ? "year" in sample : true,
      segment: sample ? "segment" in sample : true,
      social: !spRes.error,
    });
    setCampaigns(cRes.data || []);
    setImages(iRes.data || []);
    setLinks(lRes.data || []);
    setSocialPosts(spRes.data || []);
    setSocialImages(siRes.data || []);
    setSocialLinks(slRes.data || []);

      showSync("error", "Immagini/link non disponibili: " + (iRes.error || lRes.error).message);
      return;

    setTimeout(() => showSync("hidden", ""), 2200);
  }, []);

    load();

      .on("postgres_changes", { event: "*", schema: "public", table: "campaigns" }, (p) => {
        applyRealtime(setCampaigns)(p);
        if (p.eventType === "DELETE") setSelectedId((sel) => (sel === p.old.id ? null : sel));
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "campaign_images" }, applyRealtime(setImages))
      .on("postgres_changes", { event: "*", schema: "public", table: "campaign_links" }, applyRealtime(setLinks))

        applyRealtime(setSocialPosts)(p);

      .on("postgres_changes", { event: "*", schema: "public", table: "social_links" }, applyRealtime(setSocialLinks))
      .subscribe();
    return () => sb.removeChannel(channel);
  }, [load]);

      if (e.key !== "Escape" || modal || deleteTarget) return;
      setSelectedId(null);
      setSelectedSocialId(null);
    }

    return () => document.removeEventListener("keydown", onKey);
  }, [modal, deleteTarget]);

  /* ── campaigns ── */
  function cleanCampaign(data) {
    const out = { ...data };
    if (!schema.year) delete out.year;
    if (!schema.segment) delete out.segment;
    return out;
  }

  async function createCampaign(data) {
    showSync("syncing", "Salvataggio...");
    const { data: row, error } = await sb.from("campaigns").insert([cleanCampaign(data)]).select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return null; }
    setCampaigns((prev) => prev.some((c) => c.id === row.id) ? prev : [...prev, row]);
    flashSync("connected", "Campagna salvata");
    return row;
  }

  async function updateCampaign(id, data, quietMsg) {
    showSync("syncing", "Aggiornamento...");
    const { data: row, error } = await sb.from("campaigns").update(cleanCampaign(data)).eq("id", id).select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return null; }
    setCampaigns((prev) => prev.map((c) => (c.id === id ? row : c)));
    flashSync("connected", quietMsg || "Campagna aggiornata");
    return row;
  }

  async function deleteCampaign(id) {
    showSync("syncing", "Eliminazione...");
    const orphanPaths = images.filter((i) => i.campaign_id === id).map((i) => i.storage_path);
    if (orphanPaths.length) await sb.storage.from(STORAGE_BUCKET).remove(orphanPaths);
    const { error } = await sb.from("campaigns").delete().eq("id", id);

    setCampaigns((prev) => prev.filter((c) => c.id !== id));
    setImages((prev) => prev.filter((i) => i.campaign_id !== id));
    setLinks((prev) => prev.filter((l) => l.campaign_id !== id));
    setSocialPosts((prev) => prev.map((p) => (p.campaign_id === id ? { ...p, campaign_id: null } : p)));
    setSelectedId((sel) => (sel === id ? null : sel));
    flashSync("connected", "Campagna eliminata");
  }

    const { id, created_at, updated_at, ...rest } = c;
    const row = await createCampaign({ ...rest, status: rest.status === "sent" ? "tbd" : rest.status, label: c.label + " (copia)" });
    if (row) setSelectedId(row.id);
  }

  function setCampaignStatus(c, status) {
    if (c.status === status) return;
    updateCampaign(c.id, { status }, "Stato: " + STATUSES[status].label);
  }

  function moveCampaign(c, y, m, d) {
    if (yearOf(c) === y && c.month === m && c.day === d) return;
    if (!schema.year && y !== BASE_YEAR) { flashSync("error", "Le date oltre il " + BASE_YEAR + " saranno disponibili a breve"); return; }
    let end_day = null;
    if (c.end_day) {
      const span = c.end_day - c.day;
      end_day = d + span <= daysInMonth(y, m) ? d + span : null;
    }
    updateCampaign(c.id, { year: y, month: m, day: d, end_day }, "Spostata a " + fmtShort(new Date(y, m - 1, d)));
  }

  async function createSocial(data) {
    showSync("syncing", "Salvataggio...");
    const { data: row, error } = await sb.from("social_posts").insert([data]).select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return null; }
    setSocialPosts((prev) => prev.some((p) => p.id === row.id) ? prev : [...prev, row]);
    flashSync("connected", "Contenuto salvato");
    return row;
  }

  async function updateSocial(id, data, quietMsg) {
    showSync("syncing", "Aggiornamento...");
    const { data: row, error } = await sb.from("social_posts").update({ ...data, updated_at: new Date().toISOString() }).eq("id", id).select().single();
    if (error) { flashSync("error", "Errore: " + error.message); return null; }
    setSocialPosts((prev) => prev.map((p) => (p.id === id ? row : p)));

  }

  async function deleteSocial(id) {
    showSync("syncing", "Eliminazione...");
    const orphanPaths = socialImages.filter((i) => i.post_id === id).map((i) => i.storage_path);
    if (orphanPaths.length) await sb.storage.from(STORAGE_BUCKET).remove(orphanPaths);
    const { error } = await sb.from("social_posts").delete().eq("id", id);
    if (error) { flashSync("error", "Errore: " + error.message); return; }

  }

  /* ── attachments (shared by campaigns and social posts) ── */

  const imageSetter = { campaign: setImages, social: setSocialImages };
  const linkState = { campaign: links, social: socialLinks };
  const linkSetter = { campaign: setLinks, social: setSocialLinks };

  // items: [{ file, label }]
  async function uploadImagesFor(kind, ownerId, items) {
    const cfg = ATTACH[kind];
    let order = imageState[kind].filter((i) => i[cfg.fk] === ownerId).length;
    let ok = 0;
    for (const item of items) {
      const file = item.file || item;
      showSync("syncing", "Caricamento immagine...");
      try {
        const blob = await compressImage(file);
        const path = cfg.prefix + ownerId + "/" + randomKey() + ".jpg";
        const { error: upErr } = await sb.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType: "image/jpeg" });
        if (upErr) throw upErr;
        const { data: row, error: insErr } = await sb.from(cfg.images)
          .insert([{ [cfg.fk]: ownerId, storage_path: path, label: (item.label || "").trim(), sort_order: order }])
          .select().single();
        if (insErr) throw insErr;
        order++; ok++;
        imageSetter[kind]((prev) => prev.some((i) => i.id === row.id) ? prev : [...prev, row]);
      } catch (err) {
        flashSync("error", "Errore upload: " + err.message);

  const filtered = useMemo(() => {

          activeSegment={activeSegment} setActiveSegment={setActiveSegment}
          activeTypes={activeTypes} toggleType={(t) => toggleInSet(setActiveTypes, t)}
          typeCounts={typeCounts}
        />
      ) : (
        <SocialToolbar
          search={socialSearch} setSearch={setSocialSearch}
          activeFormats={activeFormats} toggleFormat={(f) => toggleInSet(setActiveFormats, f)}
          posts={socialPosts}
        />
      )}

      <div className="content">
        {loading ? (
          <div className="loading-box"><div className="spinner"></div><div>Caricamento...</div></div>
        ) : tab === "email" ? (
          view === "timeline" ? (
            <TimelineView
              campaigns={filtered}
              selectedId={selectedId}
              onSelect={(id) => selectCampaign(selectedId === id ? null : id)}
              getThumbUrl={campaignThumb}
              onStatus={setCampaignStatus}
              showPast={showPast} setShowPast={setShowPast}
              socialByCampaign={socialByCampaign}
            />
          ) : (
            <CalendarView
              campaigns={filtered}
              socialPosts={schema.social ? filteredSocial.filter((p) => p.publish_date) : []}
              cal={cal} setCal={setCal}
              selectedId={selectedId}
              onSelect={selectCampaign}
              onSelectSocial={openSocialFromCampaign}
              onMove={moveCampaign}
              onMoveSocial={moveSocialDate}
              onCreateAt={(iso) => openCreate(iso)}
              getThumbUrl={campaignThumb}
              onStatus={setCampaignStatus}
              selectedDay={selectedDay} setSelectedDay={setSelectedDay}
              socialByCampaign={socialByCampaign}
              isMobile={isMobile}
              yearLimited={!schema.year}
            />
          )
        ) : schema.social ? (
          <SocialBoard
            posts={filteredSocial}
            selectedId={selectedSocialId}
            onSelect={(id) => selectSocial(selectedSocialId === id ? null : id)}
            onMoveStatus={setSocialStatus}
            getThumbUrl={socialThumb}
            imagesByPost={imagesByPost}
            linksByPost={linksByPost}
            campaignById={campaignById}
            isMobile={isMobile}
            mobileCol={mobileCol} setMobileCol={setMobileCol}
          />
        ) : (
          <div className="notice-box">
            <strong>Social &amp; Inspo è in attivazione.</strong><br />
            Lo spazio per i contenuti da realizzare sarà disponibile a breve.
          </div>
        )}
        {tab === "email" && !loading && <Legend />}
      </div>

      {tab === "email" && selected && !modal && (
        <DetailPanel
          campaign={selected}
          images={imagesByCampaign[selected.id] || []}
          links={linksByCampaign[selected.id] || []}
          linkedSocial={socialByCampaign[selected.id] || []}
          onOpenSocial={openSocialFromCampaign}
          onStatus={(s) => setCampaignStatus(selected, s)}
          onClose={() => setSelectedId(null)}
          onEdit={() => { setModal({ kind: "campaign", mode: "edit", campaign: selected }); setSelectedId(null); }}
          onDuplicate={() => duplicateCampaign(selected)}
          onDelete={() => setDeleteTarget({ kind: "campaign", item: selected })}
        />
      )}

      {tab === "social" && selectedSocial && !modal && (
        <SocialDetailPanel
          post={selectedSocial}
          images={imagesByPost[selectedSocial.id] || []}
          links={linksByPost[selectedSocial.id] || []}
          campaign={selectedSocial.campaign_id ? campaignById[selectedSocial.campaign_id] : null}
          onOpenCampaign={openCampaignFromSocial}
          onStatus={(s) => setSocialStatus(selectedSocial, s)}
          onClose={() => setSelectedSocialId(null)}
          onEdit={() => { setModal({ kind: "social", mode: "edit", post: selectedSocial }); setSelectedSocialId(null); }}
          onDelete={() => setDeleteTarget({ kind: "social", item: selectedSocial })}
        />
      )}

      {modal && modal.kind === "campaign" && (
        <CampaignModal
          initial={modal.mode === "edit" ? modal.campaign : null}
          presetDate={modal.presetDate}
          editId={modal.mode === "edit" ? modal.campaign.id : null}
          campaignImages={modal.mode === "edit" ? (imagesByCampaign[modal.campaign.id] || []) : []}
          campaignLinks={modal.mode === "edit" ? (linksByCampaign[modal.campaign.id] || []) : []}
          yearLimited={!schema.year}
          handlers={attachHandlers}
          onCancel={() => setModal(null)}
          onSubmit={handleSubmitCampaign}
        />
      )}

      {modal && modal.kind === "social" && (
        <SocialModal
          initial={modal.mode === "edit" ? modal.post : null}
          presetDate={modal.presetDate}
          editId={modal.mode === "edit" ? modal.post.id : null}
          postImages={modal.mode === "edit" ? (imagesByPost[modal.post.id] || []) : []}
          postLinks={modal.mode === "edit" ? (linksByPost[modal.post.id] || []) : []}
          campaigns={campaigns}
          handlers={attachHandlers}
          onCancel={() => setModal(null)}
          onSubmit={handleSubmitSocial}
        />
      )}

      {deleteTarget && (
        <ConfirmDeleteModal
          title={deleteTarget.kind === "campaign" ? deleteTarget.item.label : deleteTarget.item.title}
          onCancel={() => setDeleteTarget(null)}
          onConfirm={async () => {
            if (deleteTarget.kind === "campaign") await deleteCampaign(deleteTarget.item.id);
            else await deleteSocial(deleteTarget.item.id);
            setDeleteTarget(null);
          }}
        />
      )}
    </React.Fragment>
  );
}

/* ── STATUS CONTROL (inline quick change) ───────────── */
function StatusControl({ status, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("touchstart", onDoc);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("touchstart", onDoc); };
  }, [open]);
  return (
    <span className="status-wrap" ref={ref} onClick={(e) => e.stopPropagation()} onKeyDown={(e) => e.stopPropagation()}>
      <button type="button" className="status-btn" title={"Stato: " + (STATUSES[status] || STATUSES.tbd).label + " — clicca per cambiare"} onClick={() => setOpen((o) => !o)}>
        <span className="status-dot" style={statusDotStyle(status)}></span>
      </button>
      {open && (
        <div className="status-menu">
          <div className="status-menu-title">Cambia stato</div>
          {STATUS_ORDER.map((s) => (
            <button type="button" key={s} className={status === s ? "current" : ""} onClick={() => { setOpen(false); onChange(s); }}>
              <span className="status-dot" style={statusDotStyle(s)}></span>{STATUSES[s].label}{status === s ? " ✓" : ""}
            </button>
          ))}
        </div>
      )}
    </span>
  );
}

/* ── CAMPAIGN ROW ───────────────────────────────────── */
function CampaignRow({ c, selected, onSelect, thumbUrl, onStatus, linkedCount }) {
  const d = dateOf(c);
  const seg = segmentOf(c);
  const past = isPast(c);
  return (
    <div
      className={"campaign-row" + (selected ? " selected" : "") + (past ? " is-past" : "")}
      style={statusBorderLeft(c.status)}
      role="button"
      tabIndex={0}
      onClick={() => onSelect(c.id)}
      onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSelect(c.id); } }}
    >
      <span className="day"><b>{WEEKDAY_SHORT[d.getDay()]}</b>{pad2(c.day)}{c.end_day ? "–" + pad2(c.end_day) : ""}</span>
      <span className={"thumb-slot" + (thumbUrl ? "" : " empty")}>{thumbUrl && <img src={thumbUrl} className="thumb" alt="" />}</span>
      <span className="type-badge">{typeOf(c).label}</span>
      <span className={"seg-chip" + (seg ? "" : " empty")}>{seg ? SEGMENTS[seg].short : "–"}</span>
      <span className="name">
        {c.label}
        {past && c.status !== "sent" && <span className="past-flag">da segnare</span>}
      </span>
      {linkedCount > 0 && <span className="linked-count">{linkedCount} social</span>}
      <StatusControl status={c.status} onChange={(s) => onStatus(c, s)} />
    </div>
  );
}

/* ── TIMELINE ───────────────────────────────────────── */
function TimelineView({ campaigns, selectedId, onSelect, getThumbUrl, onStatus, showPast, setShowPast, socialByCampaign }) {
  const curKey = monthKey(TODAY.getFullYear(), TODAY.getMonth() + 1);
  const keys = campaigns.map((c) => monthKey(yearOf(c), c.month));
  const minK = Math.min(curKey, ...keys);
  const maxK = Math.max(curKey + 2, ...keys);
  const allMonths = [];
  for (let k = minK; k <= maxK; k++) allMonths.push(k);
  const pastMonths = allMonths.filter((k) => k < curKey);
  const pastCampaigns = campaigns.filter((c) => monthKey(yearOf(c), c.month) < curKey);
  const pastToMark = pastCampaigns.filter((c) => c.status !== "sent").length;
  const visible = showPast ? allMonths : allMonths.filter((k) => k >= curKey);

  return (
    <React.Fragment>
      {pastMonths.length > 0 && (
        <button className="past-toggle" onClick={() => setShowPast(!showPast)}>
          <span>
            {showPast ? "▾ Nascondi mesi passati" : "▸ Mostra mesi passati"}
            {" · "}<strong>{pastCampaigns.length}</strong> campagne
            {pastToMark > 0 && <span className="warn"> · {pastToMark} da segnare come inviate</span>}
          </span>
          <span>{MONTH_NAMES[keyToYM(pastMonths[0]).m - 1]} – {MONTH_NAMES[keyToYM(pastMonths[pastMonths.length - 1]).m - 1]}</span>
        </button>
      )}
      {visible.map((k) => {
        const { y, m } = keyToYM(k);
        const items = campaigns.filter((c) => yearOf(c) === y && c.month === m).sort((a, b) => a.day - b.day || a.id - b.id);
        return (
          <MonthSection
            key={k} y={y} m={m} items={items} isCurrent={k === curKey}
            selectedId={selectedId} onSelect={onSelect} getThumbUrl={getThumbUrl} onStatus={onStatus}
            socialByCampaign={socialByCampaign}
          />
        );
      })}
    </React.Fragment>
  );
}

function MonthSection({ y, m, items, isCurrent, selectedId, onSelect, getThumbUrl, onStatus, socialByCampaign }) {
  const nodes = [];
  let needToday = isCurrent;
  let prevWeek = null;
  const todayNode = <div className="today-line" key="today">Oggi · {fmtShort(TODAY)}</div>;
  items.forEach((c) => {
    const d = dateOf(c);
    const ws = weekStart(d).getTime();
    if (ws !== prevWeek) {
      if (needToday && ws > weekStart(TODAY).getTime()) { nodes.push(todayNode); needToday = false; }
      nodes.push(<div className="week-label" key={"w" + ws}>{weekLabel(new Date(ws))}</div>);
      prevWeek = ws;
    }
    if (needToday && d >= TODAY) { nodes.push(todayNode); needToday = false; }
    nodes.push(
      <CampaignRow
        key={c.id} c={c} selected={selectedId === c.id} onSelect={onSelect}
        thumbUrl={getThumbUrl(c.id)} onStatus={onStatus}
        linkedCount={(socialByCampaign[c.id] || []).length}
      />
    );
  });
  if (needToday) nodes.push(todayNode);

  return (
    <div className="month-section">
      <div className="month-header">
        <h2>{MONTH_NAMES[m - 1]} {y}</h2>
        <span className="count">{items.length} campagn{items.length === 1 ? "a" : "e"}</span>
        {isCurrent && <span className="month-now">mese corrente</span>}
      </div>
      {items.length === 0 && <div className="month-empty">Nessuna campagna pianificata</div>}
      <div className="campaign-list">{nodes}</div>
    </div>
  );
}

/* ── CALENDAR (month grid with drag & drop) ─────────── */
function CalendarView({ campaigns, socialPosts, cal, setCal, selectedId, onSelect, onSelectSocial, onMove, onMoveSocial, onCreateAt, getThumbUrl, onStatus, selectedDay, setSelectedDay, socialByCampaign, isMobile, yearLimited }) {
  const [dragOver, setDragOver] = useState(null);
  const first = new Date(cal.y, cal.m - 1, 1);
  const offset = (first.getDay() + 6) % 7;
  const total = Math.ceil((offset + daysInMonth(cal.y, cal.m)) / 7) * 7;
  const gridStart = addDays(first, -offset);
  const cells = [];
  for (let i = 0; i < total; i++) cells.push(addDays(gridStart, i));

  const byDay = {};
  campaigns.forEach((c) => { const k = isoOf(dateOf(c)); (byDay[k] = byDay[k] || []).push(c); });
  const socialByDay = {};
  socialPosts.forEach((p) => { (socialByDay[p.publish_date] = socialByDay[p.publish_date] || []).push(p); });

  function shift(n) {
    const k = monthKey(cal.y, cal.m) + n;
    setCal(keyToYM(k));
    setSelectedDay(null);
  }

  function onDrop(e, date) {
    e.preventDefault();
    setDragOver(null);
    const data = e.dataTransfer.getData("text/plain");
    const id = Number(data.slice(2));
    if (data.startsWith("c:")) {
      const c = campaigns.find((x) => x.id === id);
      if (c) onMove(c, date.getFullYear(), date.getMonth() + 1, date.getDate());
    } else if (data.startsWith("s:")) {
      const p = socialPosts.find((x) => x.id === id);
      if (p) onMoveSocial(p, isoOf(date));
    }
  }

  const dayItems = selectedDay ? (byDay[selectedDay] || []) : [];
  const daySocial = selectedDay ? (socialByDay[selectedDay] || []) : [];
  const dayDate = selectedDay ? new Date(selectedDay + "T00:00:00") : null;

  return (
    <div>
      <div className="cal-head">
        <div className="cal-title">{MONTH_NAMES[cal.m - 1]} {cal.y}</div>
        <div className="cal-nav">
          <button onClick={() => shift(-1)} aria-label="Mese precedente">‹</button>
          <button onClick={() => { setCal({ y: TODAY.getFullYear(), m: TODAY.getMonth() + 1 }); setSelectedDay(isoOf(TODAY)); }}>Oggi</button>
          <button onClick={() => shift(1)} aria-label="Mese successivo">›</button>
        </div>
      </div>
      <div className="cal-grid">
        {DOW_HEAD.map((d) => <div className="cal-dow" key={d}>{d}</div>)}
        {cells.map((date) => {
          const iso = isoOf(date);
          const items = byDay[iso] || [];
          const soc = socialByDay[iso] || [];
          const other = date.getMonth() !== cal.m - 1;
          const all = [...items.map((c) => ({ kind: "c", c })), ...soc.map((p) => ({ kind: "s", p }))];
          const shown = all.slice(0, 4);
          return (
            <div
              key={iso}
              className={"cal-cell" + (other ? " other" : "") + (sameDayIso(iso, TODAY) ? " today" : "") + (dragOver === iso ? " drop" : "") + (selectedDay === iso ? " selected-day" : "")}
              onClick={() => setSelectedDay(selectedDay === iso ? null : iso)}
              onDragOver={isMobile ? undefined : (e) => { e.preventDefault(); if (dragOver !== iso) setDragOver(iso); }}
              onDragLeave={isMobile ? undefined : (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
              onDrop={isMobile ? undefined : (e) => onDrop(e, date)}
            >
              <div className="cal-daynum">
                <span className="n">{date.getDate()}</span>
                {!isMobile && <button className="cal-add" title="Nuova campagna in questo giorno" onClick={(e) => { e.stopPropagation(); onCreateAt(iso); }}>+</button>}
              </div>
              {shown.map((it) => it.kind === "c" ? (
                <button
                  key={"c" + it.c.id}
                  className={"cal-chip" + (isPast(it.c) ? " is-past" : "") + (selectedId === it.c.id ? " selected" : "")}
                  style={statusBorderLeft(it.c.status)}
                  draggable={!isMobile}
                  onDragStart={(e) => { e.dataTransfer.setData("text/plain", "c:" + it.c.id); e.dataTransfer.effectAllowed = "move"; }}
                  onClick={(e) => { e.stopPropagation(); onSelect(it.c.id); }}
                  title={it.c.label}
                >
                  <span className="t">{it.c.label}</span>
                  {segmentOf(it.c) && <span className="s">{SEGMENTS[segmentOf(it.c)].short}</span>}
                </button>
              ) : (
                <button
                  key={"s" + it.p.id}
                  className="cal-chip social"
                  draggable={!isMobile}
                  onDragStart={(e) => { e.dataTransfer.setData("text/plain", "s:" + it.p.id); e.dataTransfer.effectAllowed = "move"; }}
                  onClick={(e) => { e.stopPropagation(); onSelectSocial(it.p.id); }}
                  title={"Social · " + it.p.title}
                >
                  <span className="s">{(SOCIAL_FORMATS[it.p.format] || "Social").toUpperCase()}</span>
                  <span className="t">{it.p.title}</span>
                </button>
              ))}
              {all.length > shown.length && <span className="cal-more">+{all.length - shown.length} altre</span>}
              {(items.length > 0 || soc.length > 0) && (
                <div className="cal-dots">
                  {items.map((c) => <span key={c.id} className="status-dot" style={statusDotStyle(c.status)}></span>)}
                  {soc.map((p) => <span key={"s" + p.id} className="soc"></span>)}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {!isMobile && <div className="cal-hint">Trascina una campagna o un contenuto social su un altro giorno per spostarlo · "+" per crearne una in quel giorno{yearLimited ? " · date limitate al " + BASE_YEAR + " fino all'attivazione" : ""}</div>}

      {selectedDay && (
        <div className="day-list">
          <div className="day-list-head">
            <h3>{fmtLong(dayDate)}</h3>
            <button className="btn" onClick={() => onCreateAt(selectedDay)}>+ Campagna</button>
          </div>
          {dayItems.length === 0 && daySocial.length === 0 && <div className="month-empty">Nessuna campagna in questo giorno</div>}
          <div className="campaign-list">
            {dayItems.map((c) => (
              <CampaignRow
                key={c.id} c={c} selected={selectedId === c.id} onSelect={onSelect}
                thumbUrl={getThumbUrl(c.id)} onStatus={onStatus}
                linkedCount={(socialByCampaign[c.id] || []).length}
              />
            ))}
            {daySocial.map((p) => (
              <button key={p.id} className="social-row" onClick={() => onSelectSocial(p.id)}>
                <span className="fmt-chip">{SOCIAL_FORMATS[p.format] || "Social"}</span>
                <span style={{ flex: 1 }}>{p.title}</span>
                <span className="linked-count">{SOCIAL_STATUSES[p.status] ? SOCIAL_STATUSES[p.status].label : ""}</span>
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
function sameDayIso(iso, d) { return iso === isoOf(d); }

/* ── LEGEND ─────────────────────────────────────────── */
function Legend() {
  return (
    <div className="legend">
      <div className="legend-title">Legenda stati</div>
      <div className="legend-items">
        {STATUS_ORDER.map((key) => (
          <div className="legend-item" key={key}>
            <span className="legend-dot" style={statusDotStyle(key)}></span>{STATUSES[key].label}

/* ── SOCIAL BOARD ───────────────────────────────────── */
function SocialBoard({ posts, selectedId, onSelect, onMoveStatus, getThumbUrl, imagesByPost, linksByPost, campaignById, isMobile, mobileCol, setMobileCol }) {
  const [dragOver, setDragOver] = useState(null);
  const [draggingId, setDraggingId] = useState(null);

  function sorted(list) {
    return list.slice().sort((a, b) => {
      if (a.publish_date && b.publish_date) return a.publish_date.localeCompare(b.publish_date);
      if (a.publish_date) return -1;
      if (b.publish_date) return 1;
      return (b.created_at || "").localeCompare(a.created_at || "");
    });
  }

  function onDrop(e, status) {
    e.preventDefault();
    setDragOver(null);
    const data = e.dataTransfer.getData("text/plain");
    if (!data.startsWith("s:")) return;
    const p = posts.find((x) => x.id === Number(data.slice(2)));
    if (p) onMoveStatus(p, status);
  }

  return (
    <div>
      <div className="board-tabs">
        {SOCIAL_ORDER.map((s) => (
          <button key={s} className={"btn-status" + (mobileCol === s ? " active" : "")} onClick={() => setMobileCol(s)}>
            {SOCIAL_STATUSES[s].label} ({posts.filter((p) => p.status === s).length})
          </button>
        ))}
      </div>
      <div className="board">
        {SOCIAL_ORDER.map((s) => {
          const list = sorted(posts.filter((p) => (SOCIAL_STATUSES[p.status] ? p.status : "idea") === s));
          return (
            <div
              key={s}
              className={"board-col" + (dragOver === s ? " drop" : "") + (mobileCol === s ? " mobile-active" : "")}
              onDragOver={isMobile ? undefined : (e) => { e.preventDefault(); if (dragOver !== s) setDragOver(s); }}
              onDragLeave={isMobile ? undefined : (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
              onDrop={isMobile ? undefined : (e) => onDrop(e, s)}
            >
              <div className="board-col-head">
                <span className="name">{SOCIAL_STATUSES[s].label}</span>
                <span className="count">{list.length}</span>
              </div>
              <div className="board-col-body">
                {list.length === 0 && <div className="board-empty">{isMobile ? "Nessun contenuto" : "Trascina qui"}</div>}
                {list.map((p) => {
                  const thumb = getThumbUrl(p.id);
                  const camp = p.campaign_id ? campaignById[p.campaign_id] : null;
                  const nImg = (imagesByPost[p.id] || []).length;
                  const nLink = (linksByPost[p.id] || []).length;
                  return (
                    <button
                      key={p.id}
                      className={"board-card" + (selectedId === p.id ? " selected" : "") + (draggingId === p.id ? " dragging" : "")}
                      draggable={!isMobile}
                      onDragStart={(e) => { e.dataTransfer.setData("text/plain", "s:" + p.id); e.dataTransfer.effectAllowed = "move"; setDraggingId(p.id); }}
                      onDragEnd={() => setDraggingId(null)}
                      onClick={() => onSelect(p.id)}
                    >
                      {thumb && <img className="board-card-img" src={thumb} alt="" />}
                      <div className="board-card-body">
                        <div className="board-card-title">{p.title}</div>
                        <div className="board-card-meta">
                          <span className="fmt-chip">{SOCIAL_FORMATS[p.format] || "Altro"}</span>
                          {p.publish_date && <span>{fmtShort(new Date(p.publish_date + "T00:00:00"))}</span>}
                          {(nImg > 0 || nLink > 0) && <span>{[nImg ? nImg + " img" : null, nLink ? nLink + " link" : null].filter(Boolean).join(" · ")}</span>}
                        </div>
                        {camp && <div className="board-card-link">↳ {camp.label}</div>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      {!isMobile && <div className="cal-hint">Trascina le card tra le colonne per cambiarne lo stato. I contenuti con data compaiono anche nel Calendario email.</div>}
    </div>
  );
}

/* ── CAMPAIGN MODAL ─────────────────────────────────── */
function CampaignModal({ initial, presetDate, editId, campaignImages, campaignLinks, yearLimited, handlers, onCancel, onSubmit }) {
  const isCreate = !editId;
  const todayIso = isoOf(TODAY);
  const [form, setForm] = useState(() => initial ? {
    label: initial.label || "",
    type: typeKey(initial),
    status: initial.status || "tbd",
    date: isoDate(yearOf(initial), initial.month, initial.day),
    end_day: initial.end_day || "",
    notes: initial.notes || "",
    segment: initial.segment || "",
  } : {
    label: "", type: DEFAULT_TYPE, status: "tbd",
    date: presetDate || (yearLimited && TODAY.getFullYear() !== BASE_YEAR ? BASE_YEAR + "-12-31" : todayIso),
    end_day: "", notes: "", segment: "",
  });
  const [typeAuto, setTypeAuto] = useState(isCreate);
  const [segAuto, setSegAuto] = useState(isCreate || !(initial && initial.segment));
  const [stagedImages, setStagedImages] = useState([]);
  const [stagedLinks, setStagedLinks] = useState([]);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  useBodyScrollLock(true);

  const stagedRef = useRef(stagedImages);
  useEffect(() => { stagedRef.current = stagedImages; }, [stagedImages]);
  useEffect(() => () => { stagedRef.current.forEach((it) => URL.revokeObjectURL(it.previewUrl)); }, []);

  function set(field, value) { setForm((prev) => ({ ...prev, [field]: value })); }

  // Type/segment follow the title while the user hasn't chosen them by hand.
  function setText(field, value) {
    setForm((prev) => {
      const next = { ...prev, [field]: value };
      const det = detectFromText(next.label, next.notes);
      if (typeAuto && det.type) next.type = det.type;
      if (segAuto && det.segment) next.segment = det.segment;
      return next;
    });
  }

  const detected = detectFromText(form.label, form.notes);
  const typeSuggestion = !typeAuto && detected.type && detected.type !== form.type ? detected.type : null;
  const segSuggestion = !segAuto && detected.segment && detected.segment !== form.segment ? detected.segment : null;

  async function submit(e) {
    e.preventDefault();
    if (saving) return;
    if (!form.label.trim()) { setError("Inserisci il nome della campagna"); return; }
    if (!form.date) { setError("Inserisci la data"); return; }
    const { y, m, d } = parseIso(form.date);
    if (yearLimited && y !== BASE_YEAR) { setError("Per ora sono disponibili solo date del " + BASE_YEAR); return; }
    let end = form.end_day ? parseInt(form.end_day, 10) : null;
    if (end && (end <= d || end > daysInMonth(y, m))) end = null;
    setSaving(true);
    await onSubmit({
      label: form.label.trim(),
      type: form.type,
      status: form.status,
      year: y, month: m, day: d,
      end_day: end,
      notes: form.notes.trim(),
      segment: form.segment || null,
    }, editId, stagedImages, stagedLinks);
    setSaving(false);
  }

  const pd = form.date ? (() => { const p = parseIso(form.date); return new Date(p.y, p.m - 1, p.d); })() : TODAY;

  return (
    <div className="overlay sheet" onClick={saving ? undefined : onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h2>{editId ? "Modifica Campagna" : "Nuova Campagna"}</h2><button type="button" className="modal-close" onClick={onCancel} disabled={saving} aria-label="Chiudi">✕</button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            <div className="preview-box">
              <div className="preview-label">Anteprima</div>
              <div className="preview-row" style={statusBorderLeft(form.status)}>
                <span className="day"><b>{WEEKDAY_SHORT[pd.getDay()]}</b>{pad2(pd.getDate())}{form.end_day ? "–" + pad2(form.end_day) : ""}</span>
                <span className="type-badge">{TYPES[form.type].label}</span>
                {form.segment && <span className="seg-chip">{SEGMENTS[form.segment].short}</span>}
                <span className="name">{form.label || "Nome campagna"}</span>
                <span className="status-dot" style={statusDotStyle(form.status)}></span>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Nome campagna *</label>
              <input className="form-input" value={form.label} onChange={(e) => setText("label", e.target.value)} placeholder="es. Nuovi arrivi Alden — Uomo" autoFocus={!IS_TOUCH} />
              {isCreate && <div className="form-hint">Tipo e segmento vengono riconosciuti dal titolo (es. "nuovi arrivi", "back in stock", "uomo/donna"): puoi sempre cambiarli.</div>}
            </div>

            <div className="form-group form-row form-row-2">
              <div>
                <label className="form-label">Tipo{typeAuto && detected.type && <span className="auto-tag">dal titolo</span>}</label>
                <select className="form-select" value={form.type} onChange={(e) => { setTypeAuto(false); set("type", e.target.value); }}>
                  {Object.entries(TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
                {typeSuggestion && (
                  <div className="suggest-row">Dal titolo: <b>{TYPES[typeSuggestion].label}</b>
                    <button type="button" className="suggest-apply" onClick={() => set("type", typeSuggestion)}>Applica</button>
                  </div>
                )}
              </div>
              <div>
                <label className="form-label">Segmento{segAuto && detected.segment && <span className="auto-tag">dal titolo</span>}</label>
                <select className="form-select" value={form.segment} onChange={(e) => { setSegAuto(false); set("segment", e.target.value); }}>
                  <option value="">Non specificato</option>
                  {Object.entries(SEGMENTS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
                {segSuggestion && (
                  <div className="suggest-row">Dal titolo: <b>{SEGMENTS[segSuggestion].label}</b>
                    <button type="button" className="suggest-apply" onClick={() => set("segment", segSuggestion)}>Applica</button>
                  </div>
                )}
              </div>
            </div>

            <div className="form-group form-row form-row-3">
              <div>
                <label className="form-label">Data invio *</label>
                <input className="form-input" type="date" value={form.date}
                  min={yearLimited ? BASE_YEAR + "-01-01" : undefined}
                  max={yearLimited ? BASE_YEAR + "-12-31" : undefined}
                  onChange={(e) => set("date", e.target.value)} />
              </div>
              <div>
                <label className="form-label">Fino al giorno (opz.)</label>
                <input className="form-input" type="number" min="1" max="31" value={form.end_day} onChange={(e) => set("end_day", e.target.value)} placeholder="—" />
              </div>
              <div>
                <label className="form-label">Stato</label>
                <select className="form-select" value={form.status} onChange={(e) => set("status", e.target.value)}>
                  {STATUS_ORDER.map((k) => <option key={k} value={k}>{STATUSES[k].label}</option>)}
                </select>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Descrizione / Note</label>
              <textarea className="form-textarea" value={form.notes} onChange={(e) => setText("notes", e.target.value)} placeholder="Prodotti, segmenti, link da mettere, coordinamento..."></textarea>
            </div>

            <div className="form-group">
              <label className="form-label">Immagini</label>
              {editId ? (
                <ModalImageGallery
                  images={campaignImages}
                  examples={IMAGE_LABEL_EXAMPLES}
                  onUpload={(files) => handlers.onUploadImages("campaign", editId, files.map((f) => ({ file: f, label: "" })))}
                  onUpdateLabel={(id, label) => handlers.onUpdateImageLabel("campaign", id, label)}
                  onDelete={(img) => handlers.onDeleteImage("campaign", img)}
                />
              ) : (
                <StagedImagesEditor staged={stagedImages} setStaged={setStagedImages} examples={IMAGE_LABEL_EXAMPLES} />
              )}
            </div>

            <div className="form-group">
              <label className="form-label">Link</label>
              {editId ? (
                <ModalLinksSection
                  links={campaignLinks}
                  placeholder={LINK_LABEL_PLACEHOLDER}
                  onAdd={(label, url) => handlers.onAddLink("campaign", editId, label, url)}
                  onDelete={(id) => handlers.onDeleteLink("campaign", id)}
                />
              ) : (
                <StagedLinksEditor staged={stagedLinks} setStaged={setStagedLinks} placeholder={LINK_LABEL_PLACEHOLDER} />
              )}
            </div>
            {error && <div className="field-error">{error}</div>}
          </div>
          <div className="modal-footer">
            <button type="button" className="btn" onClick={onCancel} disabled={saving}>Annulla</button>
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? "Salvataggio..." : (editId ? "Salva Modifiche" : "Aggiungi Campagna")}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

                <label className="form-label">Stato</label>
                <select className="form-select" value={form.status} onChange={(e) => set("status", e.target.value)}>
                  {SOCIAL_ORDER.map((k) => <option key={k} value={k}>{SOCIAL_STATUSES[k].label}</option>)}
                </select>
              </div>
              <div>
                <label className="form-label">Pubblicazione (opz.)</label>
                <input className="form-input" type="date" value={form.publish_date} onChange={(e) => set("publish_date", e.target.value)} />
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Collegato alla campagna email (opz.)</label>
              <select className="form-select" value={form.campaign_id} onChange={(e) => set("campaign_id", e.target.value)}>
                <option value="">Nessuna</option>
                {campaignOptions.map((c) => <option key={c.id} value={c.id}>{fmtShort(dateOf(c))} — {c.label}</option>)}
              </select>
              <div className="form-hint">Così chi pianifica le email vede il contenuto social previsto per quel momento.</div>
            </div>
            <div className="form-group">
              <label className="form-label">Brief / Note</label>
              <textarea className="form-textarea" value={form.notes} onChange={(e) => set("notes", e.target.value)} placeholder="Cosa girare, mood, prodotti, caption, chi serve sul set..."></textarea>
            </div>
            <div className="form-group">
              <label className="form-label">Immagini di riferimento</label>
              {editId ? (
                <ModalImageGallery
                  images={postImages}
                  examples={INSPO_LABEL_EXAMPLES}
                  onUpload={(files) => handlers.onUploadImages("social", editId, files.map((f) => ({ file: f, label: "" })))}
                  onUpdateLabel={(id, label) => handlers.onUpdateImageLabel("social", id, label)}
                  onDelete={(img) => handlers.onDeleteImage("social", img)}
                />
              ) : (
                <StagedImagesEditor staged={stagedImages} setStaged={setStagedImages} examples={INSPO_LABEL_EXAMPLES} />
              )}
            </div>
            <div className="form-group">
              <label className="form-label">Link inspo e prodotti</label>
              {editId ? (
                <ModalLinksSection
                  links={postLinks}
                  placeholder={INSPO_LINK_PLACEHOLDER}
                  onAdd={(label, url) => handlers.onAddLink("social", editId, label, url)}
                  onDelete={(id) => handlers.onDeleteLink("social", id)}
                />
              ) : (
                <StagedLinksEditor staged={stagedLinks} setStaged={setStagedLinks} placeholder={INSPO_LINK_PLACEHOLDER} />
              )}
            </div>
            {error && <div className="field-error">{error}</div>}
          </div>
          <div className="modal-footer">
            <button type="button" className="btn" onClick={onCancel} disabled={saving}>Annulla</button>
            <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? "Salvataggio..." : (editId ? "Salva Modifiche" : "Aggiungi Contenuto")}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ── ATTACHMENT EDITORS ─────────────────────────────── */
// Create mode: images stay local until the owner row exists.
function StagedImagesEditor({ staged, setStaged, examples }) {
  function handleFiles(e) {
    const files = [...e.target.files];
    e.target.value = "";
    setStaged((prev) => [...prev, ...files.map((file) => ({ key: randomKey(), file, label: "", previewUrl: URL.createObjectURL(file) }))]);
  }
  function remove(key) {
    setStaged((prev) => {
      const target = prev.find((it) => it.key === key);
      if (target) URL.revokeObjectURL(target.previewUrl);
      return prev.filter((it) => it.key !== key);
    });
  }
  return (
    <div>
      <div className="staged-header">
        <span className="staged-count">{staged.length === 0 ? "Verranno caricate al salvataggio" : staged.length + (staged.length === 1 ? " immagine selezionata" : " immagini selezionate")}</span>
        <label className="upload-btn">+ Aggiungi<input type="file" accept="image/*" multiple onChange={handleFiles} /></label>
      </div>
      {staged.length > 0 && (
        <div className="gallery">
          {staged.map((it, idx) => (
            <div className="gallery-item" key={it.key}>
              <div className="gallery-thumb-wrap">
                <img src={it.previewUrl} alt="" />
                <div className="gallery-thumb-actions">
                  <button type="button" className="gallery-icon-btn danger" title="Rimuovi" onClick={() => remove(it.key)}>✕</button>
                </div>
              </div>
              <input type="text" className="gallery-label-input" value={it.label} placeholder={examples[idx % examples.length]}
                onChange={(e) => { const v = e.target.value; setStaged((prev) => prev.map((x) => (x.key === it.key ? { ...x, label: v } : x))); }} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Edit mode: acts immediately on Supabase. Labels save on blur/Enter so
// fast typing can't be overwritten by out-of-order responses.
function ModalImageGallery({ images, examples, onUpload, onUpdateLabel, onDelete }) {
  const [drafts, setDrafts] = useState({});
  function handleFiles(e) {
    const files = [...e.target.files];
    e.target.value = "";
    if (files.length) onUpload(files);
  }
  function commit(img) {
    const v = drafts[img.id];
    if (v === undefined) return;
    if (v.trim() !== (img.label || "")) onUpdateLabel(img.id, v.trim());
    setDrafts((d) => { const n = { ...d }; delete n[img.id]; return n; });
  }
  return (
    <div>
      <div className="staged-header">
        <span className="staged-count">{images.length === 0 ? "Nessuna immagine allegata" : images.length + (images.length === 1 ? " immagine" : " immagini")}</span>
        <label className="upload-btn">+ Aggiungi<input type="file" accept="image/*" multiple onChange={handleFiles} /></label>
      </div>
      {images.length > 0 && (
        <div className="gallery">
          {images.map((img, idx) => (
            <div className="gallery-item" key={img.id}>
              <div className="gallery-thumb-wrap">
                <img src={imagePublicUrl(img.storage_path)} alt={img.label || ""} />
                <div className="gallery-thumb-actions">
                  <button type="button" className="gallery-icon-btn" title="Scarica" onClick={() => downloadFile(imagePublicUrl(img.storage_path), (img.label || "immagine") + ".jpg")}>⬇</button>
                  <button type="button" className="gallery-icon-btn danger" title="Elimina" onClick={() => onDelete(img)}>✕</button>
                </div>
              </div>
              <input type="text" className="gallery-label-input"
                value={drafts[img.id] !== undefined ? drafts[img.id] : (img.label || "")}
                placeholder={examples[idx % examples.length]}
                onChange={(e) => { const v = e.target.value; setDrafts((d) => ({ ...d, [img.id]: v })); }}
                onBlur={() => commit(img)}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } }} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function LinkAddRow({ placeholder, onAdd }) {
  const [label, setLabel] = useState("");
  const [url, setUrl] = useState("");
  const [err, setErr] = useState("");
  function add() {
    if (!url.trim()) return;
    const normalized = normalizeUrl(url);
    if (!normalized) { setErr("Non sembra un link: incolla l'indirizzo completo (es. https://www.cappellettoshop.com/...)"); return; }
    onAdd(label.trim(), normalized);
    setLabel(""); setUrl(""); setErr("");
  }
  return (
    <div>
      <div className="link-add-row">
        <input type="text" className="link-label-input" placeholder={placeholder} value={label} onChange={(e) => setLabel(e.target.value)} />
        <input type="text" className={"link-url-input" + (err ? " invalid" : "")} placeholder="https://..." value={url}
          onChange={(e) => { setUrl(e.target.value); if (err) setErr(""); }}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } }} />
        <button type="button" className="link-add-btn" onClick={add}>+ Aggiungi</button>
      </div>
      {err && <div className="field-error">{err}</div>}
    </div>
  );
}

function StagedLinksEditor({ staged, setStaged, placeholder }) {
  return (
    <div>
      {staged.length > 0 && (
        <div className="links-list">
          {staged.map((l) => <LinkView key={l.key} l={l} onRemove={() => setStaged((prev) => prev.filter((x) => x.key !== l.key))} />)}
        </div>
      )}
      <LinkAddRow placeholder={placeholder} onAdd={(label, url) => setStaged((prev) => [...prev, { key: randomKey(), label, url }])} />
    </div>
  );
}

function ModalLinksSection({ links, placeholder, onAdd, onDelete }) {
  return (
    <div>
      {links.length > 0 && <div className="links-list">{links.map((l) => <LinkView key={l.id} l={l} onRemove={() => onDelete(l.id)} />)}</div>}
      <LinkAddRow placeholder={placeholder} onAdd={onAdd} />
    </div>
  );
}

/* ── DELETE CONFIRM ─────────────────────────────────── */
function ConfirmDeleteModal({ title, onCancel, onConfirm }) {
  const [busy, setBusy] = useState(false);
  useBodyScrollLock(true);
  return (
    <div className="overlay" onClick={busy ? undefined : onCancel}>
      <div className="modal modal-sm" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header"><h2>Eliminare "{title}"?</h2></div>
        <div className="modal-body"><p style={{ fontSize: 13, color: "#888" }}>Verranno eliminati anche immagini e link allegati. L'azione non può essere annullata.</p></div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel} disabled={busy}>Annulla</button>
          <button className="btn btn-danger" disabled={busy} onClick={async () => { setBusy(true); await onConfirm(); }}>Elimina</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
